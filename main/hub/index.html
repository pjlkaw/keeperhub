<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeeperHub</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no, address=no, email=no"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Favicon e Ícones de Aplicação -->
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />

    <!-- Header -->
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <script>
        fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
            document.getElementById('headerSection').innerHTML = data;
            document.getElementById('pageNameH1').textContent ='Olá Fulano' //Nome da Página
            document.getElementById('pageSubtittleSpan').textContent = 'Sua área' // Subtítulo
            document.getElementById('btn-back-header').href = '/main/' // Botão voltar
        });
    </script>

    <!-- Script de Inicialização Imediata do Tema (Evita FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('keeperhub-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var theme = saved || systemDark;
          document.documentElement.setAttribute('data-theme', theme);
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'light' ? '#ffffff' : '#0b0b0d');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Estilos Estruturais e Compartilhados -->
    <link rel="stylesheet" href="../../shared/styles/reset.css" />
    <link rel="stylesheet" href="../../shared/styles/variables.css" />
    <link rel="stylesheet" href="../../shared/styles/header-page.css" />
    <link rel="stylesheet" href="css/hub.css" />
  </head>
  <body>
    <div class="app-page-wrapper">
      <!-- HEADER INTERNO COMPACTO -->
      <header class="app-header" id="app-header">
        <div class="app-container">
          <div class="app-header-inner">
            <!-- IDENTIDADE À ESQUERDA: AVATAR + KEEPERHUB -->
            <a href="../hub/index.html" class="app-header-brand" id="app-header-brand" aria-label="KeeperHub - Página Inicial">
              <div class="app-header-avatar" aria-hidden="true">
                <!-- Avatar demonstrativo elegante e estável em SVG -->
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="app-header-avatar-img">
                  <circle cx="18" cy="18" r="18" fill="#1E293B"/>
                  <circle cx="18" cy="14" r="6" fill="#94A3B8"/>
                  <path d="M7 32C7 26.4772 11.9249 22 18 22C24.0751 22 29 26.4772 29 32" fill="#64748B"/>
                </svg>
              </div>
              <span class="app-header-brand-name">KeeperHub</span>
            </a>
          </div>
        </div>
      </header>

      <!-- CONTEÚDO PRINCIPAL / RESUMO DIÁRIO -->
      <main class="app-main" id="main-content">
        <div class="app-container">
          <!-- SEÇÃO DE SAUDAÇÃO -->
          <section class="section-header-section" id="headerSection"></section>

          <!-- CARDS DOS 5 MÓDULOS -->
          <section class="app-modules-stack" id="modules-stack" aria-label="Resumo dos Módulos">
            <!-- 1. CARD METAS -->
            <article class="module-card" id="hub-card-metas" tabindex="0">
              <div class="module-card-top-accent accent-top-metas" aria-hidden="true"></div>
              
              <div class="module-card-header">
                <img
                  src="../assets/img/logo-metas.png"
                  alt=""
                  class="module-card-logo-icon"
                  width="18"
                  height="18"
                />
                <span class="module-card-tag">METAS</span>
              </div>

              <div class="module-card-content">
                <span class="module-card-val-huge val-yellow">72%</span>
                <span class="module-card-sublabel">Progresso Geral</span>
              </div>

              <!-- Marca d'Água: Logo Oficial Discreta -->
              <div class="module-card-watermark" aria-hidden="true">
                <img
                  src="../assets/img/logo-metas.png"
                  alt=""
                  class="module-card-watermark-img watermark-metas"
                  width="80"
                  height="80"
                  loading="lazy"
                />
              </div>
            </article>

            <!-- 2. CARD FINANÇAS -->
            <a href="../../modules/financas/index.html" class="module-card module-card-interactive" id="hub-card-financas" aria-label="Acessar Módulo Finanças">
              <div class="module-card-top-accent accent-top-financas" aria-hidden="true"></div>

              <div class="module-card-header">
                <img
                  src="../assets/img/logo-financas.png"
                  alt=""
                  class="module-card-logo-icon"
                  width="18"
                  height="18"
                />
                <span class="module-card-tag">FINANÇAS</span>
              </div>

              <div class="module-card-content">
                <span class="module-card-val-title val-white">R$ 4.520,00</span>
                <span class="module-card-sublabel">Saldo Atual</span>
              </div>

              <!-- Marca d'Água: Logo Oficial Discreta -->
              <div class="module-card-watermark" aria-hidden="true">
                <img
                  src="../assets/img/logo-financas.png"
                  alt=""
                  class="module-card-watermark-img watermark-financas"
                  width="82"
                  height="82"
                  loading="lazy"
                />
              </div>
            </a>

            <!-- 3. CARD PETS -->
            <a href="../../modules/pets/index.html" class="module-card module-card-interactive" id="hub-card-pets" aria-label="Acessar Módulo Pets">
              <div class="module-card-top-accent accent-top-pets" aria-hidden="true"></div>

              <div class="module-card-header">
                <img
                  src="../assets/img/logo-pets.png"
                  alt=""
                  class="module-card-logo-icon"
                  width="18"
                  height="18"
                />
                <span class="module-card-tag">PETS</span>
              </div>

              <div class="module-card-content">
                <div class="module-pets-row">
                  <div class="module-pets-avatar" aria-hidden="true">
                    <img
                      src="../assets/img/logo-pets.png"
                      alt=""
                      class="module-pets-avatar-icon"
                      width="26"
                      height="26"
                    />
                  </div>
                  <div class="module-pets-details">
                    <span class="module-pets-name">Luna</span>
                    <span class="module-card-sublabel">3 anos • Tudo ok</span>
                  </div>
                </div>
              </div>

              <!-- Marca d'Água: Logo Oficial Discreta -->
              <div class="module-card-watermark" aria-hidden="true">
                <img
                  src="../assets/img/logo-pets.png"
                  alt=""
                  class="module-card-watermark-img watermark-pets"
                  width="78"
                  height="78"
                  loading="lazy"
                />
              </div>
            </a>

            <!-- 4. CARD MEDICAMENTOS -->
            <a href="../../modules/medicamentos/index.html" class="module-card module-card-interactive" id="hub-card-medicamentos" aria-label="Acessar Módulo Medicamentos">
              <div class="module-card-top-accent accent-top-medicamentos" aria-hidden="true"></div>

              <div class="module-card-header">
                <img
                  src="../assets/img/logo-medicamentos.png"
                  alt=""
                  class="module-card-logo-icon"
                  width="18"
                  height="18"
                />
                <span class="module-card-tag">MEDICAMENTOS</span>
              </div>

              <div class="module-card-content">
                <div class="module-meds-row">
                  <span class="meds-time-badge">14:00</span>
                  <span class="meds-name-text">Vitamina D</span>
                </div>
                <span class="module-card-sublabel">Próxima dose</span>
              </div>

              <!-- Marca d'Água: Logo Oficial Discreta -->
              <div class="module-card-watermark" aria-hidden="true">
                <img
                  src="../assets/img/logo-medicamentos.png"
                  alt=""
                  class="module-card-watermark-img watermark-medicamentos"
                  width="80"
                  height="80"
                  loading="lazy"
                />
              </div>
            </a>

            <!-- 5. CARD DESPENSA -->
            <article class="module-card" id="hub-card-despensa" tabindex="0">
              <div class="module-card-top-accent accent-top-despensa" aria-hidden="true"></div>

              <div class="module-card-header">
                <img
                  src="../assets/img/logo-despensa.png"
                  alt=""
                  class="module-card-logo-icon"
                  width="18"
                  height="18"
                />
                <span class="module-card-tag">DESPENSA</span>
              </div>

              <div class="module-card-content">
                <span class="module-card-val-title val-white">3 Itens</span>
                <span class="module-card-sublabel">Estoque Baixo</span>
              </div>

              <!-- Marca d'Água: Logo Oficial Discreta -->
              <div class="module-card-watermark" aria-hidden="true">
                <img
                  src="../assets/img/logo-despensa.png"
                  alt=""
                  class="module-card-watermark-img watermark-despensa"
                  width="84"
                  height="84"
                  loading="lazy"
                />
              </div>
            </article>
          </section>
        </div>
      </main>
    </div>

    <!-- Script Compartilhado de Tema (JavaScript Clássico) -->
    <script src="../../shared/services/theme.js"></script>

    <!-- Script Exclusivo do Hub -->
    <script type="module" src="js/hub.js"></script>
  </body>
</html>
