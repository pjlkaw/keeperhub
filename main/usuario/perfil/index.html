<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeeperHub — Perfil</title>
    <meta name="description" content="Perfil do usuário no KeeperHub." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('keeperhub-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../../shared/styles/reset.css" />
    <link rel="stylesheet" href="../../../shared/styles/variables.css" />
    <link rel="stylesheet" href="../../../shared/styles/header-page.css" />
    <link rel="stylesheet" href="css/perfil.css" />
  </head>

  <body>
    <div class="perfil-app">
      <header class="section-header-section perfil-cabecalho">
        <div class="section-header-title-area">
          <div class="section-header-top-row">
            <a class="section-header-back-btn" href="../../hub/index.html" aria-label="Voltar ao Hub">
              <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="section-header-title">Perfil</h1>
          </div>
        </div>
        <div class="section-header-controls">
          <button class="btn-header" id="theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="perfil-conteudo" id="conteudo-principal">
        <section class="perfil-resumo" aria-labelledby="nome-usuario">
          <div class="perfil-avatar" aria-hidden="true">
            <i class="fa-regular fa-user"></i>
          </div>

          <div class="perfil-identidade">
            <h2 class="perfil-identidade__nome" id="nome-usuario">Gabriel Santos</h2>
          </div>
        </section>

        <a class="perfil-editar" id="editar-perfil" href="editar/index.html">
          <i class="fa-solid fa-pen" aria-hidden="true"></i>
          <span>Editar Perfil</span>
        </a>
      </main>
    </div>

    <script src="../../../shared/services/theme.js" defer></script>
    <script src="js/perfil.js" defer></script>
  </body>
</html>
