<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" fill="none" aria-label="KeeperHub">
  <!-- KeeperHub Horizontal Logo -->
  <g transform="translate(0, 2)">
    <!-- Icon symbol -->
    <g transform="translate(0, 0) scale(0.68)">
      <!-- Upper Arcs / Protection canopy -->
      <path d="M 6 12 A 18 18 0 0 1 20 4" stroke="#70DE01" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 28 4 A 18 18 0 0 1 42 12" stroke="#70DE01" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <!-- Head -->
      <circle cx="24" cy="14" r="4.5" fill="#70DE01" />
      <!-- Human / K Body -->
      <path d="M 12 18 L 24 24 L 36 18" stroke="#70DE01" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 24 24 L 24 42" stroke="#70DE01" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 24 30 L 35 42" stroke="#70DE01" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
    <!-- Brand Wordmark -->
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.5px">
      <tspan fill="#70DE01">Keeper</tspan><tspan fill="#FFFFFF" font-weight="600">Hub</tspan>
    </text>
  </g>
</svg>
