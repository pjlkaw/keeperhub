<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Veja os avisos dos seus módulos no KeeperHub." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Notificações | KeeperHub</title>

    <link rel="icon" type="image/svg+xml" href="/main/assets/img/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/main/assets/img/favicon-32x32.png" />

    <script>
       window.keeperhubModuleConfig = {
       module: 'Notificação',
       title: 'Notificações',
       subtitle: 'veja suas notificações',
       backUrl: '/hub',
       notificationsModule: 'Notificação',
       addUrl: ''
     };
 
    </script>
    <script defer src="/shared/services/load-components.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/shared/styles/variables.css" />
    <link rel="stylesheet" href="/shared/styles/reset.css" />
    <link rel="stylesheet" href="/shared/styles/components.css" />
    <link rel="stylesheet" href="/shared/styles/header-page.css" />
    <link rel="stylesheet" href="/shared/styles/notifications.css" />
    <link rel="stylesheet" href="/shared/styles/rodape.css" />
    <link rel="stylesheet" href="/shared/services/theme.js">
  </head>

  <body>
    <div class="lembretes-app">
    <header class="section-header-section" id="headerSection"></header>
      <main class="lembretes-conteudo" id="conteudo-principal">
        <form class="busca-lembretes" role="search">
          <label for="buscar-lembretes" class="somente-leitor-tela">Buscar avisos</label>
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="buscar-lembretes" type="search" placeholder="Buscar avisos" autocomplete="off" />
        </form>

        <section aria-labelledby="titulo-categorias">
          <h2 class="somente-leitor-tela" id="titulo-categorias">Filtrar avisos por módulo</h2>
          <div class="grade-categorias">
            <button class="cartao-categoria cartao-categoria--pets" type="button" data-modulo="pets">
              <img src="/shared/img/logo-pets-branco.png" width="30px">
              <strong>Pets</strong>
              <span data-contador="pets">0</span>
            </button>
            <button class="cartao-categoria cartao-categoria--medicamentos" type="button" data-modulo="medicamentos">
              <img src="/shared/img/logo-medicamentos-branco.png" width="30px">
              <strong>Medicamentos</strong>
              <span data-contador="medicamentos">0</span>
            </button>
            <button class="cartao-categoria cartao-categoria--financas" type="button" data-modulo="financas">
              <img src="/shared/img/logo-financas-branco.png" width="30px">
              <strong>Finanças</strong>
              <span data-contador="financas">0</span>
            </button>
            <button class="cartao-categoria cartao-categoria--despensa" type="button" data-modulo="despensa">
              <img src="/shared/img/logo-despensa-branco.png" width="30px">
              <strong>Despensa</strong>
              <span data-contador="despensa">0</span>
            </button>
            <button class="cartao-categoria cartao-categoria--todos" type="button" data-modulo="todos">
              <i class="fa-solid fa-check" aria-hidden="true"></i>
              <strong>Todos</strong>
              <span data-contador="todos">0</span>
            </button>
          </div>
        </section>

        <section class="avisos" aria-labelledby="titulo-avisos">
          <h2 class="avisos__titulo" id="titulo-avisos">Todos os avisos</h2>
          <p class="avisos__estado" id="avisos-estado" role="status" aria-live="polite">Carregando avisos...</p>
          <div class="avisos__lista" id="avisos-lista"></div>
        </section>
      </main>

<footer class="rodape" id="site-footer">
  <div class="container">
    <div class="divisoria-rodape" aria-hidden="true"></div>
    <div class="conteudo-rodape">
      <span class="marca-rodape" id="footer-brand">KeeperHub</span>
      <nav class="links-rodape" id="footer-nav" aria-label="Links institucionais">
        <a href="/main/privacidade/index.html" class="link-rodape" id="link-footer-privacy">Política de Privacidade</a>
        <a href="/main/termos/index.html" class="link-rodape" id="link-footer-terms">Termos de Uso</a>
        <a href="/main/contato/index.html" class="link-rodape" id="link-footer-contact">Contato</a>
        <a href="/main/faq/index.html" class="link-rodape" id="link-footer-faq">FAQ</a>
      </nav>
      <p class="direitos-rodape" id="footer-copyright">
        &copy; 2026 KeeperHub. Todos os direitos reservados.
      </p>
    </div>
  </div>
</footer>

      <div class="aviso-desfazer" id="aviso-desfazer" role="status" aria-live="polite" hidden>
        <span id="aviso-desfazer-texto"></span>
        <button type="button" id="aviso-desfazer-botao">Desfazer</button>
      </div>
    </div>
    <script src="../../shared/services/theme.js"></script>
    <script src="/shared/services/notifications.js"></script>
  </body>
</html>
