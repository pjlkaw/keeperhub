<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../../shared/styles/components.css">
    <link rel="stylesheet" href="../../../shared/styles/header-page.css">
    <link rel="stylesheet" href="../../../shared/styles/interface.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../../../shared/services/theme.js" defer></script>
    <title>Minhas Contas — KeeperHub</title>
</head>
<body class="pagina-financas">
    <section id="alertFromShared" class="alert" role="status" aria-live="polite"></section>
    <section class="app-shell">
        <section class="screen transactions-list-screen accounts-screen">
            <header class="section-header-section" id="headerSection">
                <div class="section-header-title-area">
                    <div class="section-header-top-row">
                        <a href="../index.html" class="section-header-back-btn" id="btn-back-header" aria-label="Voltar para finanças" title="Voltar para finanças">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        </a>
                        <h1 id="pageNameH1" class="section-header-title">Minhas Contas</h1>
                    </div>
                    <div class="section-header-meta">
                        <span id="pageSubtittleSpan">Gerenciamento de contas e carteiras</span>
                    </div>
                </div>
                <div class="section-header-controls">
                    <button type="button" class="btn-header" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema" data-theme-bound="true">
                        <img src="../../../shared/img/icon-theme-sun.png" alt="" aria-hidden="true" class="theme-icon theme-icon-sun" width="18" height="18" />
                        <img src="../../../shared/img/icon-theme-moon.png" alt="" aria-hidden="true" class="theme-icon theme-icon-moon" width="18" height="18" />
                    </button>
                    <a href="../../../shared/components/notifications.html?modulo=financas" class="btn-header" id="btn-notifications" aria-label="Notificações de Finanças" title="Notificações de Finanças">
                        <i class="fa-solid fa-bell" aria-hidden="true"></i>
                    </a>
                </div>
            </header>
            <main class="transactions-content">
                <form class="card account-form" id="account-form">
                    <label class="field-label" for="account-name">Nome da conta</label>
                    <input class="account-input" id="account-name" name="name" placeholder="Ex: Conta principal" required>
                    <label class="field-label" for="account-type">Tipo</label>
                    <select class="account-input" id="account-type" name="type" required><option value="" selected disabled>Selecione o tipo</option><option>Conta corrente</option><option>Poupança</option><option>Carteira</option><option>Cartão</option></select>
                    <button class="save-button" type="submit">Cadastrar conta</button>
                </form>
                <section class="card account-list" id="account-list" aria-label="Contas cadastradas"></section>
            </main>
        </section>
    </section>
    <script type="module" src="../script.js"></script>
</body>
</html>
