<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/styles/variables.css">
    <link rel="stylesheet" href="../../../shared/styles/reset.css">
    <link rel="stylesheet" href="../../../shared/styles/components.css">
    <link rel="stylesheet" href="../../../shared/styles/header-page.css">
    <link rel="stylesheet" href="../../../shared/styles/interface.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../../../shared/services/theme.js" defer></script>
    <title>Transações — KeeperHub</title>
</head>

<body class="pagina-financas finance-page">
    <section id="alertFromShared" class="alert" role="status" aria-live="polite"></section>
    <main class="finance-shell transactions-list-screen">
        <header class="section-header-section" id="headerSection">
            <div class="section-header-title-area">
                <div class="section-header-top-row">
                    <a href="../index.html" class="section-header-back-btn" id="btn-back-header" aria-label="Voltar para finanças" title="Voltar para finanças">
                        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                    </a>
                    <h1 id="pageNameH1" class="section-header-title">Transações</h1>
                </div>
                <div class="section-header-meta">
                    <span id="pageSubtittleSpan">Movimentações e histórico</span>
                </div>
            </div>
            <div class="section-header-controls">
                <button type="button" class="btn-header" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema" data-theme-bound="true">
                    <img src="../../../shared/img/icon-theme-sun.png" alt="" aria-hidden="true" class="theme-icon theme-icon-sun" width="18" height="18" />
                    <img src="../../../shared/img/icon-theme-moon.png" alt="" aria-hidden="true" class="theme-icon theme-icon-moon" width="18" height="18" />
                </button>
                <a href="../../../shared/components/notifications.html?modulo=financas" class="btn-header" id="btn-notifications" aria-label="Notificações de Finanças" title="Notificações de Finanças">
                    <i class="fa-solid fa-bell" aria-hidden="true"></i>
                </a>
            </div>
        </header>
        <nav class="finance-tabs" aria-label="Seções de finanças">
            <a href="../index.html">Visão geral</a>
            <a class="active" href="transacoes.html" aria-current="page">Transações</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="contas.html">Contas</a>
            <a href="nova-transacao.html">Nova transação</a>
        </nav>
        <section class="finance-content transactions-content">
            <form class="transactions-search" role="search">
                <label class="search-field">
                    <span class="search-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <input type="search" placeholder="Buscar transações..." aria-label="Buscar transações">
                </label>
                <!-- removed icon button to keep search clean -->
            </form>
            <div class="filter-row">
                <nav class="filter-chips" aria-label="Filtros de transações">
                    <button class="filter-active" type="button" data-filter="all">Todas</button>
                    <button type="button" data-filter="receitas">Receitas</button>
                    <button type="button" data-filter="despesas">Despesas</button>
                    <button type="button" data-filter="este-mes">▣ Este Mês</button>
                </nav>
                <div class="filter-actions-wrap">
                    <button class="filter-actions" type="button" aria-label="Abrir opções de visualização" aria-expanded="false">
                        <span aria-hidden="true">☷</span>
                    </button>
                    <div class="filter-popup" hidden aria-hidden="true">
                        <button type="button" data-popup-filter="receitas">Mostrar apenas Receitas</button>
                        <button type="button" data-popup-filter="despesas">Mostrar apenas Despesas</button>
                        <button type="button" data-popup-filter="este-mes">Mostrar Este Mês</button>
                        <button type="button" data-popup-filter="all">Limpar filtros</button>
                    </div>
                </div>
            </div>
            <section class="card transaction-list" id="transaction-list" aria-live="polite">
                <p class="empty-state">Carregando transações...</p>
            </section>
            <a class="transactions-add" href="nova-transacao.html" aria-label="Nova transação">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                </svg>
            </a>
        </section>
    </main>
    <script type="module" src="../script.js"></script>
</body>

</html>
