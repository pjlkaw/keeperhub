<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulte e filtre todas as suas movimentações financeiras no KeeperHub.">
    <title>Transações • Finanças • KeeperHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/no-content.css">
    <link rel="stylesheet" href="/shared/styles/btn-add.css">

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/transacoes.css">
    <link rel="stylesheet" href="../assets/css/padroes.css">
    <script src="/shared/services/theme.js" defer></script>
    <title>Transações</title>
    <script src="../js/interface.js" defer></script>
    <script>
        window.keeperhubModuleConfig = {
            module: 'financas',
            title: 'Transações',
            subtitle: 'Consulte suas movimentações',
            backUrl: '/modules/financas/index.html',
            notificationsModule: 'financas'
        };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>

<body class="finance-page">
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper finance-modules-nav" aria-label="Navegação entre módulos"></nav>
            <div class="app-container">
    <div class="finance-shell transactions-list-screen">

        

        <header class="section-header-section" id="headerSection"></header>
        <section class="no-content-section" id="no-content-section" aria-label="Nenhuma transação cadastrada" hidden></section>

        <nav class="finance-tabs" aria-label="Seções de finanças">
            <a href="../index.html">Visão geral</a>
            <a class="active" href="transacoes.html" aria-current="page">Transações</a>
            <a href="relatorios.html">Relatórios</a>
            <a href="contas.html">Contas</a>
            <a href="vencimentos.html">Vencimentos</a>
            <a href="nova-transacao.html">Nova transação</a>
        </nav>

        <section class="finance-content transactions-content">

            <form class="transactions-search" role="search">
                <p class="search-field">
                    <button class="search-icon" type="submit" aria-label="Pesquisar transações">
                        <span class="fa-solid fa-magnifying-glass" aria-hidden="true"></span>
                    </button>
                    <input type="search" placeholder="Buscar transações..." aria-label="Buscar transações">
                </p>
            </form>

            <section class="filter-row" aria-label="Filtros de transações">
                <div class="transaction-dates" aria-label="Datas das transações"></div>
                <section class="filter-actions-wrap" aria-label="Opções de filtragem">
                    <button class="filter-actions" type="button" aria-controls="filter-popup" aria-label="Abrir opções de visualização" aria-expanded="false">
                        Filtros<span aria-hidden="true"><span class="fa-solid fa-sliders" aria-hidden="true"></span></span>
                    </button>
                    <nav class="filter-popup" id="filter-popup" aria-label="Opções de filtragem" hidden>
                        <button type="button" data-popup-filter="receitas">Mostrar apenas Receitas</button>
                        <button type="button" data-popup-filter="despesas">Mostrar apenas Despesas</button>
                        <button type="button" data-popup-filter="este-mes">Mostrar Este Mês</button>
                        <button type="button" data-popup-filter="all">Limpar filtros</button>
                    </nav>
                </section>
            </section>

            <section class="card transaction-list" id="transaction-list" aria-live="polite">
                <p class="empty-state">Carregando transações...</p>
            </section>

        </section>

        <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-financas)"></section>

    </div>

    <script type="module" src="../script.js"></script>

            </div>
        </div>
    </body>

</html>
