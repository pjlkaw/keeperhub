<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receitas • Medicamentos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/header.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <link rel="stylesheet" href="../assets/css/meds-list.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <script>
        fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
            document.getElementById('headerSection').innerHTML = data;
            document.getElementById('pageNameH1').textContent = 'Receitas';
            document.getElementById('pageSubtittleSpan').textContent = 'Consulta, prescrições e anexos';
            document.getElementById('btn-back-header').href = 'medicacoes.html';
        });
    </script>
</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
            <header class="section-header-section" id="headerSection"></header>

            <main class="meds-main" id="main-content">
                <div class="meds-stack">
                    <section class="meds-group-section" aria-labelledby="prescriptions-title">
                        <h2 class="meds-group-title" id="prescriptions-title">Receitas cadastradas</h2>

                        <div class="meds-list" role="list">
                            <a href="receita-medicamento.html">
                                <div class="med-card" role="listitem" tabindex="0">
                                    <div class="med-card-left">
                                        <div class="med-card-icon-wrap" aria-hidden="true">
                                            <i class="fa-solid fa-file-medical" style="color: var(--color-meds-primary);"></i>
                                        </div>
                                        <div class="med-card-info">
                                            <span class="med-card-name">Consulta cardiovascular</span>
                                            <span class="med-card-details">Dra. Mariana Costa • 28 Jul 2026</span>
                                        </div>
                                    </div>
                                    <div class="med-card-right">
                                        <span class="med-card-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
                                    </div>
                                </div>
                            </a>

                            <div class="med-card" role="listitem" tabindex="0">
                                <div class="med-card-left">
                                    <div class="med-card-icon-wrap" aria-hidden="true">
                                        <i class="fa-solid fa-file-medical" style="color: var(--color-meds-primary);"></i>
                                    </div>
                                    <div class="med-card-info">
                                        <span class="med-card-name">Controle de glicemia</span>
                                        <span class="med-card-details">Dr. Renato Silva • 10 Ago 2026</span>
                                    </div>
                                </div>
                                <div class="med-card-right">
                                    <span class="med-card-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="/shared/services/theme.js"></script>
</body>
</html>
