<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar receita • Medicamentos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <link rel="stylesheet" href="../assets/css/meds-form.css">
    <script>
        fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
            document.getElementById('headerSection').innerHTML = data;
            document.getElementById('pageNameH1').textContent = 'Adicionar receita';
            document.getElementById('pageSubtittleSpan').textContent = 'Cadastre a prescrição e anexe os arquivos';
            document.getElementById('btn-back-header').href = 'receitas.html';
        });
    </script>
</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
            <header class="section-header-section" id="headerSection"></header>

            <main class="meds-main" id="main-content">
                <form class="meds-form" id="form-add-prescription">
                    <section class="card meds-form-block" aria-labelledby="prescription-data-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="prescription-data-title">Dados da receita</h2>
                        </div>

                        <div class="meds-form-field">
                            <label for="prescription-title" class="meds-form-label">Título da receita</label>
                            <input class="meds-form-input" id="prescription-title" name="title" type="text" placeholder="Ex.: Consulta cardiovascular" required />
                        </div>

                        <div class="meds-form-row">
                            <div class="meds-form-field">
                                <label for="prescription-professional" class="meds-form-label">Profissional de saúde</label>
                                <input class="meds-form-input" id="prescription-professional" name="professional" type="text" placeholder="Ex.: Dra. Mariana Costa" required />
                            </div>
                            <div class="meds-form-field">
                                <label for="prescription-specialty" class="meds-form-label">Especialidade</label>
                                <input class="meds-form-input" id="prescription-specialty" name="specialty" type="text" placeholder="Ex.: Cardiologia" />
                            </div>
                        </div>

                        <div class="meds-form-field">
                            <label for="prescription-date" class="meds-form-label">Data da receita</label>
                            <input class="meds-form-input" id="prescription-date" name="date" type="date" required />
                        </div>

                        <div class="meds-form-field">
                            <label for="prescription-medication" class="meds-form-label">Medicamento vinculado</label>
                            <select class="meds-form-select" id="prescription-medication" name="medication">
                                <option value="">Não vincular medicamento</option>
                            </select>
                        </div>

                        <div class="meds-form-field">
                            <label for="prescription-instructions" class="meds-form-label">Orientações</label>
                            <textarea class="meds-form-input" id="prescription-instructions" name="instructions" rows="3" placeholder="Ex.: 1 comprimido, 2 vezes ao dia"></textarea>
                        </div>
                    </section>

                    <section class="card meds-form-block" aria-labelledby="prescription-attachments-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="prescription-attachments-title">Anexos</h2>
                        </div>
                        <div class="meds-form-field">
                            <label for="prescription-files" class="meds-form-label">Imagens ou PDFs</label>
                            <input class="meds-form-input" id="prescription-files" name="attachments" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" multiple />
                            <p class="meds-form-helper">Até 1 MB no total. Os arquivos ficam salvos localmente neste navegador, de forma provisória.</p>
                        </div>
                    </section>

                    <div class="meds-form-submit-container">
                        <button type="submit" class="btn-meds-submit">
                            <span>Salvar receita</span>
                        </button>
                        <div class="meds-form-feedback" id="form-feedback-msg" role="status" aria-live="polite"></div>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>
</body>
</html>
