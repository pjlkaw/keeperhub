<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Medicamento • Medicamentos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <link rel="stylesheet" href="../assets/css/meds-form.css">
    <script>
        window.keeperhubModuleConfig = {
            module: 'medicamentos',
            title: 'Editar medicamento',
            subtitle: 'Ajuste os detalhes da dose e da rotina.',
            backUrl: '/modules/medicamentos/components/detalhes-medicamento.html',
            notificationsModule: 'medicamentos'
        };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
                <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navega&#231;&#227;o entre m&#243;dulos"></nav>
            <header class="section-header-section" id="headerSection"></header>

            <main id="main-content">
                <form class="meds-form" id="form-edit-medication" novalidate>
                    <section class="card meds-form-block" aria-labelledby="block-med-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="block-med-title">Medicamento</h2>
                        </div>

                        <div class="meds-form-field">
                            <label for="input-med-name" class="meds-form-label">
                                <span>Nome do medicamento <span class="meds-label-required" aria-hidden="true">*</span></span>
                            </label>
                            <input type="text" class="meds-form-input" id="input-med-name" required />
                        </div>

                        <div class="meds-form-field">
                            <label for="input-med-concentration" class="meds-form-label">
                                <span>Concentração</span>
                                <span class="meds-label-optional">Opcional</span>
                            </label>
                            <input type="text" class="meds-form-input" id="input-med-concentration" />
                        </div>
                    </section>

                    <section class="card meds-form-block" aria-labelledby="block-treatment-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="block-treatment-title">Tratamento</h2>
                        </div>

                        <div class="meds-form-field">
                            <span class="meds-form-label">
                                <span>Tipo de uso <span class="meds-label-required" aria-hidden="true">*</span></span>
                            </span>
                            <div class="meds-usage-type-group" role="radiogroup" aria-label="Tipo de uso">
                                <label class="meds-usage-option active">
                                    <input type="radio" name="usageType" value="continuo" />
                                    <span>Uso contínuo</span>
                                </label>
                                <label class="meds-usage-option">
                                    <input type="radio" name="usageType" value="temporario" />
                                    <span>Tratamento temporário</span>
                                </label>
                                <label class="meds-usage-option">
                                    <input type="radio" name="usageType" value="eventual" />
                                    <span>Uso eventual</span>
                                </label>
                            </div>
                        </div>

                        <div class="meds-form-field" id="field-start-date">
                            <label for="input-start-date" class="meds-form-label">
                                <span>Data de início</span>
                                <span class="meds-label-optional">Opcional</span>
                            </label>
                            <input type="date" class="meds-form-input" id="input-start-date" />
                        </div>
                        <div class="meds-form-field" id="field-end-date" style="display: none;">
                            <label for="input-end-date" class="meds-form-label">
                                <span>Data de término</span>
                                <span class="meds-label-optional">Opcional</span>
                            </label>
                            <input type="date" class="meds-form-input" id="input-end-date" />
                        </div>
                    </section>

                    <section class="card meds-form-block" id="section-routine" aria-labelledby="block-routine-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="block-routine-title">Rotina</h2>
                        </div>

                        <div class="meds-form-field">
                            <label for="input-med-dose" class="meds-form-label">
                                <span>Dose por horário</span>
                                <span class="meds-label-optional">Opcional</span>
                            </label>
                            <input type="text" class="meds-form-input" id="input-med-dose" maxlength="100" />
                        </div>

                        <div class="meds-form-field">
                            <label for="select-med-frequency" class="meds-form-label">
                                <span>Frequência</span>
                            </label>
                            <select class="meds-form-select" id="select-med-frequency">
                                <option value="diario">Todos os dias</option>
                                <option value="especifico">Em dias específicos</option>
                                <option value="intervalo">A cada X horas</option>
                            </select>
                        </div>

                        <div class="meds-form-field" id="field-frequency-interval" style="display: none;">
                            <label for="input-frequency-interval" class="meds-form-label">Intervalo em horas</label>
                            <input type="number" class="meds-form-input" id="input-frequency-interval" min="1" max="48" />
                        </div>

                        <div class="meds-form-field" id="field-frequency-days" style="display: none;">
                            <span class="meds-form-label">Dias da semana</span>
                            <div class="meds-weekday-grid">
                                <label><input type="checkbox" name="weekdays" value="seg" /> Seg</label>
                                <label><input type="checkbox" name="weekdays" value="ter" /> Ter</label>
                                <label><input type="checkbox" name="weekdays" value="qua" /> Qua</label>
                                <label><input type="checkbox" name="weekdays" value="qui" /> Qui</label>
                                <label><input type="checkbox" name="weekdays" value="sex" /> Sex</label>
                                <label><input type="checkbox" name="weekdays" value="sab" /> Sáb</label>
                                <label><input type="checkbox" name="weekdays" value="dom" /> Dom</label>
                            </div>
                        </div>

                        <div class="meds-form-field" id="section-times">
                            <span class="meds-form-label">
                                <span>Horários</span>
                            </span>

                            <div class="meds-times-list" id="times-list">
                                <div class="meds-time-row">
                                    <input type="text" class="meds-form-input meds-time-input" aria-label="Horário 1" name="times" inputmode="numeric" placeholder="HH:mm" maxlength="5" pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" title="Informe o horário no formato 24 horas, por exemplo 07:00." />
                                </div>
                                <div class="meds-time-row">
                                    <input type="text" class="meds-form-input meds-time-input" aria-label="Horário 2" name="times" inputmode="numeric" placeholder="HH:mm" maxlength="5" pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" title="Informe o horário no formato 24 horas, por exemplo 07:00." />
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="card meds-form-block" aria-labelledby="block-stock-title">
                        <div class="meds-form-block-header">
                            <h2 class="meds-form-block-title" id="block-stock-title">Unidade de estoque</h2>
                        </div>
                        <div class="meds-form-field">
                            <label for="select-stock-unit" class="meds-form-label">Unidade</label>
                            <select class="meds-form-select" id="select-stock-unit">
                                <option value="comprimidos">comprimidos</option>
                                <option value="capsulas">cápsulas</option>
                                <option value="ml">ml</option>
                                <option value="gotas">gotas</option>
                                <option value="unidades">unidades</option>
                            </select>
                        </div>
                    </section>

                    <div class="meds-form-submit-container">
                        <button type="submit" class="btn-meds-submit" id="btn-save-edition">
                            <span>Salvar alterações</span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>
</body>
</html>
