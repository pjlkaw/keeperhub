<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Medicações • Medicamentos • KeeperHub</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Estilos Estruturais e Compartilhados -->
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">

        <!-- Essentials -->
        <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
        <link rel="stylesheet" href="../assets/css/essentials/layout.css">
        <link rel="stylesheet" href="../assets/css/essentials/header.css">
        <link rel="stylesheet" href="../assets/css/essentials/components.css">

        <!-- Main -->
        <link rel="stylesheet" href="../assets/css/meds-list.css">


        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <script>
            fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
                document.getElementById('headerSection').innerHTML = data;
                document.getElementById('pageNameH1').textContent ='Estoque' //Nome da Página
                document.getElementById('pageSubtittleSpan').textContent = '' // Subtítulo
                document.getElementById('btn-back-header').href = '../index.html' // Botão voltar
            });
        </script>
    </head>
    <body>
        <div class="app-page-wrapper">
            <div class="app-container">
                <!-- CABEÇALHO DA TELA MEDICAÇÕES -->
                <header class="section-header-section" id="headerSection"></header>

                <!-- ABAS DE NAVEGAÇÃO INTERNA -->
                <nav class="meds-subnav-tabs" role="tablist" aria-label="Seções de medicações">
                    <button type="button" class="meds-tab-button active" role="tab" aria-selected="true" id="tab-medications" tabindex="0">Medicações</button>
                    <button type="button" class="meds-tab-button" role="tab" aria-selected="false" id="tab-prescriptions" tabindex="-1">Receitas</button>
                </nav>

                <!-- CONTEÚDO PRINCIPAL -->
                <main class="meds-main" id="main-content">
                    <div class="meds-stack">
                        <!-- BARRA DE BUSCA E FILTRO -->
                        <div class="meds-search-filter-row" role="search">
                            <div class="meds-search-box">
                                <i class="fa-solid fa-magnifying-glass meds-search-icon" aria-hidden="true"></i>
                                <input type="search" class="meds-search-input" id="input-search-medications" placeholder="Buscar medicação" aria-label="Buscar medicação" autocomplete="off" />
                            </div>

                            <button type="button" class="btn-meds-filter" id="btn-filter-medications" aria-label="Filtrar medicações" title="Filtrar medicações">
                                <i class="fa-solid fa-filter" aria-hidden="true"></i>
                            </button>
                        </div>

                        <!-- GRUPO 1: USO CONTÍNUO -->
                        <section class="meds-group-section" aria-labelledby="group-continuous-title">
                            <h2 class="meds-group-title" id="group-continuous-title">Uso Contínuo</h2>

                            <div class="meds-list" role="list">
                                <!-- Item 1: Losartana -->
                                <a href="detalhes-medicamento.html">
                                    <div class="med-card" role="listitem" tabindex="0" id="med-card-losartana">
                                        <div class="med-card-left">
                                            <div class="med-card-icon-wrap" aria-hidden="true">
                                                <img src="/shared/img/logo-medicamentos.png" alt="" class="med-card-icon-img" width="22" height="22" loading="lazy" />
                                            </div>
                                            <div class="med-card-info">
                                                <span class="med-card-name">Losartana 50 mg</span>
                                                <span class="med-card-details">1 comprimido • 08:00 e 20:00</span>
                                            </div>
                                        </div>
                                        <div class="med-card-right">
                                            <span class="med-status-badge med-status-badge--active">Ativo</span>
                                            <span class="med-card-arrow" aria-hidden="true">
                                                <i class="fa-solid fa-chevron-right"></i>
                                            </span>
                                        </div>
                                    </div>
                                </a>

                                <!-- Item 2: Vitamina D -->
                                <div class="med-card" role="listitem" tabindex="0" id="med-card-vitaminad">
                                    <div class="med-card-left">
                                        <div class="med-card-icon-wrap" aria-hidden="true">
                                            <img src="/shared/img/logo-medicamentos.png" alt="" class="med-card-icon-img" width="22" height="22" loading="lazy" />
                                        </div>
                                        <div class="med-card-info">
                                            <span class="med-card-name">Vitamina D</span>
                                            <span class="med-card-details">1 cápsula • 20:00</span>
                                        </div>
                                    </div>
                                    <div class="med-card-right">
                                        <span class="med-status-badge med-status-badge--active">Ativo</span>
                                        <span class="med-card-arrow" aria-hidden="true">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- GRUPO 2: TRATAMENTOS TEMPORÁRIOS -->
                        <section class="meds-group-section" aria-labelledby="group-temporary-title">
                            <h2 class="meds-group-title" id="group-temporary-title">Tratamentos Temporários</h2>

                            <div class="meds-list" role="list">
                                <!-- Item 3: Amoxicilina -->
                                <div class="med-card" role="listitem" tabindex="0" id="med-card-amoxicilina">
                                    <div class="med-card-left">
                                        <div class="med-card-icon-wrap" aria-hidden="true">
                                            <img src="/shared/img/logo-medicamentos.png" alt="" class="med-card-icon-img" width="22" height="22" loading="lazy" />
                                        </div>
                                        <div class="med-card-info">
                                            <span class="med-card-name">Amoxicilina 500 mg</span>
                                            <span class="med-card-details">1 cápsula • 8/8h • Até 30 de agosto</span>
                                        </div>
                                    </div>
                                    <div class="med-card-right">
                                        <span class="med-status-badge med-status-badge--treatment">Em tratamento</span>
                                        <span class="med-card-arrow" aria-hidden="true">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- GRUPO 3: USO EVENTUAL -->
                        <section class="meds-group-section" aria-labelledby="group-eventual-title">
                            <h2 class="meds-group-title" id="group-eventual-title">Uso Eventual</h2>

                            <div class="meds-list" role="list">
                                <!-- Item 4: Dipirona -->
                                <div class="med-card" role="listitem" tabindex="0" id="med-card-dipirona">
                                    <div class="med-card-left">
                                        <div class="med-card-icon-wrap" aria-hidden="true">
                                            <img src="/shared/img/logo-medicamentos.png" alt="" class="med-card-icon-img" width="22" height="22" loading="lazy" />
                                        </div>
                                        <div class="med-card-info">
                                            <span class="med-card-name">Dipirona 500 mg</span>
                                            <span class="med-card-details">Uso quando necessário</span>
                                        </div>
                                    </div>
                                    <div class="med-card-right">
                                        <span class="med-status-badge med-status-badge--eventual">Eventual</span>
                                        <span class="med-card-arrow" aria-hidden="true">
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- AÇÃO SECUNDÁRIA: HISTÓRICO -->
                        <div class="meds-history-action-row">
                            <button type="button" class="btn-meds-secondary" id="btn-medications-history">
                                <span>Histórico de medicações</span>
                                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </main>

                <!-- FAB (BOTÃO FLUTUANTE ADICIONAR) -->
                <a href="/modules/medicamentos/components/adicionar-medicamento.html" class="btn-meds-fab" id="btn-meds-fab" aria-label="Adicionar medicamento" title="Adicionar medicamento">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </a>
            </div>
        </div>

        <!-- Scripts -->
        <script src="/shared/services/theme.js"></script>
        <script type="module" src="/modules/medicamentos/js/script.js"></script>
    </body>
</html>
