<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Progresso & Saúde • Medicamentos • KeeperHub</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Estilos Estruturais e Compartilhados -->
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">

        <!-- Essentials -->
        <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
        <link rel="stylesheet" href="../assets/css/essentials/layout.css">
        <link rel="stylesheet" href="../assets/css/essentials/components.css">

        <!-- Main -->
        <link rel="stylesheet" href="../assets/css/meds-dashboard.css">

        <script>
            fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
                document.getElementById('headerSection').innerHTML = data;
                document.getElementById('pageNameH1').textContent ='Dashboard' //Nome da Página
                document.getElementById('pageSubtittleSpan').textContent = '' // Subtítulo
                document.getElementById('btn-back-header').href = '../index.html' // Botão voltar
            });
        </script>
    </head>
    <body>
        <div class="app-page-wrapper">
            <div class="app-container">
                <!-- CABEÇALHO DA TELA PROGRESSO & SAÚDE -->
                <header class="section-header-section" id="headerSection"></header>
                
                <!-- CONTEÚDO PRINCIPAL -->
                <main class="meds-main" id="main-content">
                    <div class="meds-stack">

                        <!-- SELECT DE PERÍODO -->
                        <div class="meds-filter-dropdown-wrap">
                            <select class="meds-select-period" id="select-period-filter" aria-label="Selecionar período do histórico">
                                <option value="semana">Semana</option>
                                <option value="mes" selected>Mês</option>
                                <option value="mes-anterior">Mês Passado</option>
                                <option value="ultimos-30-dias">Últimos 30 dias</option>
                            </select>
                        </div>
                        
                        <!-- CARD 1: SEQUÊNCIA ATIVA -->
                        <section class="card meds-card-stat streak-card" aria-label="Sequência Ativa">
                            <div class="meds-card-stat-header">
                                <div class="meds-card-stat-title-group">
                                    <span class="meds-stat-label">SEQUÊNCIA ATIVA</span>
                                    <div class="meds-stat-main-row">
                                        <span class="meds-stat-big-val"></span>
                                        <span class="meds-badge-success"></span>
                                    </div>
                                </div>
                                <div class="meds-card-stat-icon-wrap" aria-hidden="true">
                                    <i class="fa-solid fa-fire-flame-curved icon-streak"></i>
                                </div>
                            </div>

                            <p class="meds-stat-description"></p>

                            <!-- DIAS DA SEMANA -->
                            <div class="meds-week-days" role="group" aria-label="Dias da semana"></div>
                        </section>

                        <!-- CARD 2: DOSES CONCLUÍDAS -->
                        <section class="card meds-card-stat doses-card" aria-label="Doses Concluídas">
                            <div class="meds-card-stat-header">
                                <span class="meds-stat-title">Doses Concluídas</span>
                                <span class="meds-status-dot" aria-hidden="true"></span>
                            </div>

                            <div class="meds-stat-counter-row">
                                <span class="meds-counter-current"></span>
                                <span class="meds-counter-divider">/</span>
                                <span class="meds-counter-total"></span>
                            </div>

                            <div class="meds-progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                <div class="meds-progress-bar-fill" style="width: 0%;"></div>
                            </div>
                        </section>

                        <!-- CARD 4: CALENDÁRIO MENSUAL -->
                        <section class="card meds-card-stat calendar-card" aria-label="Calendário">
                            <div class="meds-calendar-header">
                                <h2 class="meds-calendar-month-title"></h2>
                                <div class="meds-calendar-nav">
                                    <button type="button" class="btn-cal-nav" aria-label="Mês anterior">
                                        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                                    </button>
                                    <button type="button" class="btn-cal-nav" aria-label="Próximo mês">
                                        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="meds-calendar-grid"></div>

                            <!-- LEGENDA DO CALENDÁRIO -->
                            <div class="meds-calendar-legend">
                                <div class="legend-item">
                                    <span class="legend-dot legend-taken"></span>
                                    <span>Todas tomadas</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-dot legend-delayed"></span>
                                    <span>Atrasada</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-dot legend-missed"></span>
                                    <span>Perdida</span>
                                </div>
                            </div>
                        </section>

                        <!-- CARD 5: PRÓXIMO MARCO -->
                        <section class="card meds-card-stat milestone-card" aria-label="Próximo Marco">
                            <div class="meds-milestone-icon-wrap" aria-hidden="true">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <div class="meds-milestone-info">
                                <h3 class="meds-milestone-title"></h3>
                                <p class="meds-milestone-desc"></p>
                            </div>
                        </section>

                    </div>
                </main>
            </div>
        </div>

        <!-- Scripts -->
        <script src="/shared/services/theme.js"></script>
        <script type="module" src="/modules/medicamentos/script.js"></script>
    </body>
</html>
