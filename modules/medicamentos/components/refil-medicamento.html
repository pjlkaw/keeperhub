<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registrar Reposição • KeeperHub</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Estilos Estruturais e Compartilhados -->
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">

        <!-- Essentials -->
        <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
        <link rel="stylesheet" href="../assets/css/essentials/layout.css">
        <link rel="stylesheet" href="../assets/css/essentials/components.css">

        <!-- Main -->
        <link rel="stylesheet" href="../assets/css/med-refill.css">

        <script>
        window.keeperhubModuleConfig = {
            module: 'medicamentos',
            title: 'Reposição',
            subtitle: 'Reponha o estoque de medicamentos',
            backUrl: '/modules/medicamentos/index.html',
            notificationsModule: 'medicamentos'
        };
    </script>
    <script src="/shared/services/load-components.js"></script>
    </head>
    <body>
        <div class="app-page-wrapper">
            <div class="app-container">
                <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navega&#231;&#227;o entre m&#243;dulos"></nav>
                <!-- CABEÇALHO DA TELA REGISTRAR REPOSIÇÃO -->
                <header class="section-header-section" id="headerSection"></header>

                <!-- CONTEÚDO PRINCIPAL -->
                <main class="meds-main" id="main-content">
                    <form class="meds-stack" id="form-register-refill" novalidate>
                        
                        <!-- CARD RESUMO DO MEDICAMENTO -->
                        <section class="card med-summary-card" aria-label="Medicamento selecionado">
                            <div class="med-summary-icon-wrap" aria-hidden="true">
                                <i class="fa-solid fa-pills"></i>
                            </div>
                            <div class="med-summary-info">
                                <h1 class="med-summary-name"></h1>
                                <span class="med-summary-type"></span>
                                <div class="med-summary-badge">
                                    <i class="fa-solid fa-box-archive" aria-hidden="true"></i>
                                    <span>Estoque atual</span>
                                </div>
                            </div>
                        </section>

                        <!-- CAMPO: QUANTIDADE ADQUIRIDA -->
                        <div class="form-group">
                            <label for="input-quantity" class="form-label">
                                Quantidade adquirida <span class="form-asterisk">*</span>
                            </label>
                            <div class="input-with-suffix">
                                <input type="number" id="input-quantity" name="quantity" class="form-input" min="1" required />
                                <span class="input-suffix"></span>
                            </div>
                        </div>

                        <!-- CAMPO: VALIDADE -->
                        <div class="form-group">
                            <label for="input-expiration" class="form-label">
                                Validade <span class="form-label-optional">(Opc)</span>
                            </label>
                            <div class="input-with-icon">
                                <input type="date" id="input-expiration" name="expiration" class="form-input" />
                                <i class="fa-regular fa-calendar input-icon" aria-hidden="true"></i>
                            </div>
                        </div>

                        <!-- CARD RESUMO DOS CÁLCULOS -->
                        <section class="card med-calculation-card" aria-label="Resumo do novo estoque">
                            <div class="calc-row">
                                <span class="calc-label">Estoque atual</span>
                                <span class="calc-value"></span>
                            </div>
                            <div class="calc-row">
                                <span class="calc-label">Nova entrada</span>
                                <span class="calc-value"></span>
                            </div>
                            <div class="calc-divider"></div>
                            <div class="calc-row calc-row--total">
                                <span class="calc-total-label">Novo total</span>
                                <span class="calc-total-value"></span>
                            </div>
                        </section>

                        <!-- BOTÃO DE SUBMISSÃO -->
                        <div class="form-submit-container">
                            <button type="submit" class="btn-meds-submit" id="btn-submit-refill">
                                Registrar reposição
                            </button>
                        </div>

                    </form>
                </main>
            </div>
        </div>

        <!-- Scripts -->
        <script src="/shared/services/theme.js"></script>
        <script type="module" src="/modules/medicamentos/script.js"></script>
    </body>
</html>
