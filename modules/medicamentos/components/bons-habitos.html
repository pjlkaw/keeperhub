<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bons Hábitos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Essentials -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <!-- main -->
    <link rel="stylesheet" href="../assets/css/habits.css">

    <link rel="stylesheet" href="../assets/css/meds-form.css">

    <script>
        window.keeperhubModuleConfig = {
            module: 'medicamentos',
            title: 'Bons Hábitos',
            subtitle: '',
            backUrl: '/modules/medicamentos/',
            notificationsModule: 'medicamentos'
        };
    </script>
    <script src="/shared/services/load-components.js"></script>

</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
                <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navega&#231;&#227;o entre m&#243;dulos"></nav>
            <header class="section-header-section" id="headerSection"></header>

            <main class="habits-main" id="main-content">
                <section class="card habits-week-card" aria-label="Resumo da semana">
                    <div class="habits-week-heading">
                        <div>
                            <span class="habits-card-kicker">Sua semana</span>
                            <h2></h2>
                        </div>
                        <i class="fa-solid fa-fire-flame-curved habits-fire" aria-hidden="true"></i>
                    </div>
                    <div class="habits-week"></div>
                </section>
                
                <section aria-labelledby="habits-today-title">
                    <div class="habits-section-heading">
                        <div class="habits-score" aria-label="Progresso de hoje">
                            <strong></strong>
                            <span>hoje</span>
                        </div>
                        <div>
                            <span class="habits-card-kicker">Checklist diário</span>
                            <h2 id="habits-today-title">O que você quer cultivar hoje?</h2>
                        </div>
                        <span class="habits-count"></span>
                    </div>
                    <div class="habits-list"></div>
                </section>

                <a href="adicionar-habito.html" class="habits-add-button">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Adicionar hábito
                </a>
            </main>
        </div>
    </div>
    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>
</body>
</html>
