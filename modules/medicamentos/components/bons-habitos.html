<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bons Hábitos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Essentials -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <!-- main -->
    <link rel="stylesheet" href="../assets/css/habits.css">

    <link rel="stylesheet" href="../assets/css/meds-form.css">

    <script>
        fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
            document.getElementById('headerSection').innerHTML = data;
            document.getElementById('pageNameH1').textContent ='Bons Hábitos' //Nome da Página
            document.getElementById('pageSubtittleSpan').textContent = '' // Subtítulo
            document.getElementById('btn-back-header').href = '../index.html' // Botão voltar
        });
    </script>

</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
            <header class="section-header-section" id="headerSection"></header>

            <main class="habits-main" id="main-content">
                <section class="card habits-week-card" aria-label="Resumo da semana">
                    <div class="habits-week-heading">
                        <div>
                            <span class="habits-card-kicker">Sua semana</span>
                            <h2>0 dias de sequência</h2>
                        </div>
                        <i class="fa-solid fa-fire-flame-curved habits-fire" aria-hidden="true"></i>
                    </div>
                    <div class="habits-week">
                        <span class="habits-day"><span>seg</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day"><span>ter</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day"><span>qua</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day"><span>qui</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day"><span>sex</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day"><span>sáb</span><span class="habits-day-mark"></span></span>
                        <span class="habits-day is-today"><span>dom</span><span class="habits-day-mark"></span></span>
                    </div>
                </section>
                
                <section aria-labelledby="habits-today-title">
                    <div class="habits-section-heading">
                        <div class="habits-score" aria-label="Progresso de hoje">
                            <strong>0%</strong>
                            <span>hoje</span>
                        </div>
                        <div>
                            <span class="habits-card-kicker">Checklist diário</span>
                            <h2 id="habits-today-title">O que você quer cultivar hoje?</h2>
                        </div>
                        <span class="habits-count">0 de 4</span>
                    </div>
                    <div class="habits-list">
                        <article class="card habit-row">
                            <span class="habit-check" aria-hidden="true"></span>
                            <span class="habit-row-content"><span class="habit-row-name">Beber água</span><span class="habit-row-meta">Meta diária: 2 litros</span></span>
                            <i class="fa-solid fa-droplet habit-row-icon" aria-hidden="true"></i>
                        </article>
                        <article class="card habit-row">
                            <span class="habit-check" aria-hidden="true"></span>
                            <span class="habit-row-content"><span class="habit-row-name">Caminhar</span><span class="habit-row-meta">Meta diária: 20 minutos</span></span>
                            <i class="fa-solid fa-person-walking habit-row-icon" aria-hidden="true"></i>
                        </article>
                        <article class="card habit-row">
                            <span class="habit-check" aria-hidden="true"></span>
                            <span class="habit-row-content"><span class="habit-row-name">Dormir bem</span><span class="habit-row-meta">Meta diária: 7h30 de sono</span></span>
                            <i class="fa-solid fa-moon habit-row-icon" aria-hidden="true"></i>
                        </article>
                        <article class="card habit-row">
                            <span class="habit-check" aria-hidden="true"></span>
                            <span class="habit-row-content"><span class="habit-row-name">Ler um pouco</span><span class="habit-row-meta">Meta diária: 10 páginas</span></span>
                            <i class="fa-solid fa-book-open habit-row-icon" aria-hidden="true"></i>
                        </article>
                    </div>
                </section>

                <a href="adicionar-habito.html" class="habits-add-button">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Adicionar hábito
                </a>
            </main>
        </div>
    </div>
    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>
</body>
</html>
