<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar hábito • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/habits.css">

    <!-- Button + -->
    <link rel="stylesheet" href="/shared/styles/btn-add.css">

    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <script>
        window.keeperhubModuleConfig = {
            module: 'medicamentos',
            title: 'Adicionar Hábito',
            subtitle: '',
            backUrl: '/modules/medicamentos/components/bons-habitos.html',
            notificationsModule: 'medicamentos',
            addUrl: '/modules/medicamentos/components/adicionar-medicamento.html'
        };
    </script>

    <script src="/shared/services/load-components.js"></script>
</head>
<body>
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navega&#231;&#227;o entre m&#243;dulos"></nav>
            <div class="app-container">
    <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-medicamentos)"></section>
    
        
                
            <header class="section-header-section" id="headerSection"></header>

            <main class="habits-main">
                <section class="habit-form-intro" aria-labelledby="new-habit-title">
                    <span class="habits-eyebrow"><i class="fa-solid fa-seedling" aria-hidden="true"></i> Pequenos passos</span>
                    <h2 id="new-habit-title">O que você quer cultivar?</h2>
                    <p>Escolha um hábito simples para acompanhar na sua rotina.</p>
                </section>

                <form class="card habit-create-form" action="bons-habitos.html" method="get" novalidate>
                    <div class="habit-form-field">
                        <label for="habit-name">
                            Nome do hábito <span class="habit-required" aria-hidden="true">*</span>
                        </label>
                        <input id="habit-name" name="habit-name" type="text"
                            placeholder="Ex.: Meditar por 10 minutos" minlength="2" maxlength="200"
                            autocomplete="off" required />
                        <small class="habit-field-help">Escolha algo simples e fácil de reconhecer.</small>
                    </div>

                    <div class="habit-form-field">
                        <label for="habit-frequency">
                            Frequência <span class="habit-required" aria-hidden="true">*</span>
                        </label>
                        <input id="habit-frequency" name="habit-frequency" type="text"
                            list="habit-frequency-options" placeholder="Ex.: Todos os dias"
                            maxlength="80" required />
                        <datalist id="habit-frequency-options">
                            <option value="Todos os dias"></option>
                            <option value="Durante a semana"></option>
                            <option value="Fins de semana"></option>
                            <option value="A cada 2 dias"></option>
                            <option value="Dias úteis"></option>
                        </datalist>
                    </div>

                    <div class="habit-form-field">
                        <label for="habit-goal">
                            Meta diária <span class="habit-required" aria-hidden="true">*</span>
                        </label>
                        <div class="habit-goal-row">
                            <input id="habit-goal" name="habit-goal" type="number" min="0.1" max="100000"
                                step="0.1" placeholder="1" required />
                            <input id="habit-unit" name="habit-unit" type="text"
                                list="habit-unit-options" placeholder="Ex.: minutos" maxlength="40" required />
                            <datalist id="habit-unit-options">
                                <option value="vez por dia"></option>
                                <option value="minutos por dia"></option>
                                <option value="copos por dia"></option>
                                <option value="páginas por dia"></option>
                                <option value="litros por dia"></option>
                                <option value="quilômetros por dia"></option>
                            </datalist>
                        </div>
                    </div>

                    <p class="habit-form-feedback" data-form-feedback aria-live="polite"></p>
                    <div class="habit-form-actions">
                        <a class="habit-cancel-button" href="bons-habitos.html">Cancelar</a>
                        <button type="submit" class="habit-save-button">
                        <i class="fa-solid fa-check" aria-hidden="true"></i>
                            <span>Criar hábito</span>
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>
    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>

            </div>
        </div>
    </body>
</html>
