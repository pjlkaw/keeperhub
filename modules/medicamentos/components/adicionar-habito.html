<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar hábito • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/habits.css">
</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
            <header class="section-header-section">
                <div class="section-header-title-area">
                    <div class="section-header-top-row">
                        <a href="bons-habitos.html" class="section-header-back-btn" id="btn-back-header" aria-label="Voltar para Bons Hábitos">
                            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                        </a>
                        <h1 id="pageNameH1" class="section-header-title">Novo hábito</h1>
                    </div>
                    <div class="section-header-meta"><span id="pageSubtittleSpan">Crie uma rotina que faça sentido</span></div>
                </div>
                <div class="section-header-controls">
                    <button type="button" class="btn-theme-toggle" id="theme-toggle" aria-label="Ativar tema claro" title="Ativar tema claro" data-theme-bound="true">
                        <img src="/shared/img/icon-theme-sun.png" alt="" aria-hidden="true" class="theme-icon theme-icon-sun" width="18" height="18" />
                        <img src="/shared/img/icon-theme-moon.png" alt="" aria-hidden="true" class="theme-icon theme-icon-moon" width="18" height="18" />
                    </button>
                </div>
            </header>

            <main class="habits-main">
                <section class="habit-form-intro" aria-labelledby="new-habit-title">
                    <span class="habits-eyebrow"><i class="fa-solid fa-seedling" aria-hidden="true"></i> Pequenos passos</span>
                    <h2 id="new-habit-title">O que você quer cultivar?</h2>
                    <p>Escolha um hábito simples para acompanhar na sua rotina.</p>
                </section>

                <form class="card habit-create-form" action="bons-habitos.html" method="get">
                    <label for="habit-name">Nome do hábito</label>
                    <input id="habit-name" name="habit-name" type="text" placeholder="Ex.: Meditar por 10 minutos" required />

                    <label for="habit-frequency">Frequência</label>
                    <select id="habit-frequency" name="habit-frequency">
                        <option>Todos os dias</option>
                        <option>Durante a semana</option>
                        <option>Fins de semana</option>
                    </select>

                    <label for="habit-goal">Meta</label>
                    <div class="habit-goal-row">
                        <input id="habit-goal" name="habit-goal" type="number" min="1" placeholder="1" required />
                        <select aria-label="Unidade da meta" name="habit-unit">
                            <option>vez por dia</option>
                            <option>minutos por dia</option>
                            <option>copos por dia</option>
                            <option>páginas por dia</option>
                        </select>
                    </div>

                    <button type="submit" class="habit-save-button">
                        <i class="fa-solid fa-check" aria-hidden="true"></i>
                        Criar hábito
                    </button>
                </form>
            </main>
        </div>
    </div>
    <script src="/shared/services/theme.js"></script>
</body>
</html>
