<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receita Médica • Medicamentos • KeeperHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
    <link rel="stylesheet" href="../assets/css/essentials/layout.css">
    <link rel="stylesheet" href="../assets/css/essentials/components.css">
    <link rel="stylesheet" href="../assets/css/med-details.css">
    <script>
        window.keeperhubModuleConfig = {
            module: 'medicamentos',
            title: 'Receita',
            subtitle: 'Prescrição vinculada',
            backUrl: '/modules/medicamentos/components/detalhes-medicamento.html',
            notificationsModule: 'medicamentos'
        };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>
    <div class="app-page-wrapper">
        <div class="app-container">
                <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navega&#231;&#227;o entre m&#243;dulos"></nav>
            <header class="section-header-section" id="headerSection"></header>

            <main class="meds-main" id="main-content">
                <div class="meds-stack">
                    <section class="card med-card-section" aria-labelledby="prescription-title">
                        <div class="med-card-section-header">
                            <h2 class="med-card-section-title" id="prescription-title"></h2>
                        </div>

                        <div class="med-inner-box">
                            <div class="med-inner-box-row">
                                <span class="med-inner-label">Especialidade</span>
                                <span class="med-inner-value"></span>
                            </div>
                            <div class="med-inner-box-row">
                                <span class="med-inner-label">Data</span>
                                <span class="med-inner-value"></span>
                            </div>
                            <div class="med-inner-box-row">
                                <span class="med-inner-label">Medicamento</span>
                                <span class="med-inner-value med-inner-value--highlight"></span>
                            </div>
                            <div class="med-inner-box-row">
                                <span class="med-inner-label">Orientação</span>
                                <span class="med-inner-value"></span>
                            </div>
                        </div>
                    </section>

                    <section class="card med-card-section" aria-labelledby="attachment-title">
                        <h2 class="med-card-section-title" id="attachment-title">Anexos</h2>
                        <div class="med-routine-list"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="/shared/services/theme.js"></script>
    <script type="module" src="/modules/medicamentos/script.js"></script>
</body>
</html>
