<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rotina • Medicamentos • KeeperHub</title>

        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Estilos Estruturais e Compartilhados -->
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">

        <!-- Essentials -->
        <link rel="stylesheet" href="../assets/css/essentials/meds-variables.css">
        <link rel="stylesheet" href="../assets/css/essentials/layout.css">
        <link rel="stylesheet" href="../assets/css/essentials/components.css">

        <!-- Main -->
        <link rel="stylesheet" href="../assets/css/rotina.css">

        <script>
            fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
                document.getElementById('headerSection').innerHTML = data;
                document.getElementById('pageNameH1').textContent ='Rotina' //Nome da Página
                document.getElementById('pageSubtittleSpan').textContent = '' // Subtítulo
                document.getElementById('btn-back-header').href = '../index.html' // Botão voltar
            });
        </script>

    </head>
    <body>
        <div class="app-page-wrapper">
            <div class="app-container">
                <!-- CABEÇALHO DA TELA ROTINA -->
                <header class="section-header-section" id="headerSection"></header>

                <!-- CONTEÚDO PRINCIPAL -->
                <main class="meds-main" id="main-content">
                    <div class="routine-stack">
                        <!-- SELETOR DE DATA / NAVEGAÇÃO POR DIA -->
                        <nav class="routine-date-selector" aria-label="Navegação por data">
                            <button type="button" class="btn-date-nav" id="btn-prev-day" aria-label="Dia anterior">
                                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                            </button>
                            <span class="routine-current-date" id="current-date-label"></span>
                            <button type="button" class="btn-date-nav" id="btn-next-day" aria-label="Próximo dia">
                                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                            </button>
                        </nav>

                        <!-- RESUMO DIÁRIO (BADGES DE MÉTRICAS) -->
                        <section class="card routine-summary-section" aria-label="Resumo diário">
                            <div class="routine-summary-header">
                                <h2 class="routine-summary-title">RESUMO<br />DIÁRIO</h2>
                                <div class="routine-summary-badges">
                                    <div class="routine-badge routine-badge--doses"></div>
                                    <div class="routine-badge routine-badge--taken"></div>
                                    <div class="routine-badge routine-badge--pending"></div>
                                    <div class="routine-badge routine-badge--delayed"></div>
                                </div>
                            </div>

                            <!-- BANNER DE STATUS CONCLUÍDO -->
                            <div class="routine-completion-banner" role="status">
                                <div class="routine-completion-icon" aria-hidden="true">
                                    <i class="fa-solid fa-check"></i>
                                </div>
                                <div class="routine-completion-text">
                                    <span>Medicações de hoje concluídas</span>
                                </div>
                            </div>
                        </section>

                        <!-- TIMELINE / CRONOGRAMA DE HORÁRIOS -->
                        <section class="routine-timeline" aria-label="Linha do tempo de medicações"></section>

                        <!-- AÇÃO INFERIOR: REGISTRAR USO EVENTUAL -->
                        <div class="routine-action-footer">
                            <a href="/modules/medicamentos/components/uso-eventual.html" type="button" class="btn-register-eventual" id="btn-register-eventual-use">
                                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                                <span>Registrar uso eventual</span>
                            </a>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Scripts -->
        <script src="/shared/services/theme.js"></script>
        <script type="module" src="/modules/medicamentos/script.js"></script>
    </body>
</html>
