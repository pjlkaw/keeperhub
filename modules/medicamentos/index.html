<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Medicamentos • KeeperHub</title>
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Estilos Estruturais e Compartilhados -->
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        
        <link rel="stylesheet" href="/shared/styles/interface.css">
        
        <!-- Essentials -->
        <link rel="stylesheet" href="assets/css/essentials/meds-variables.css">
        <link rel="stylesheet" href="assets/css/essentials/layout.css">
        <link rel="stylesheet" href="assets/css/essentials/components.css">
        <script src="/shared/services/theme.js"></script>
        <script>
            window.keeperhubModuleConfig = {
                module: 'medicamentos',
                title: 'Medicamentos',
                subtitle: 'Gestão de suas medicações',
                backUrl: '/main/',
                notificationsModule: 'medicamentos',
                addUrl: '/modules/medicamentos/components/adicionar-medicamento.html'
            };
        </script>
        <script src="/shared/services/load-components.js"></script>

        <!-- Main -->
        <link rel="stylesheet" href="assets/css/home.css">
        <!-- Navbar -->
        <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
        <!-- Header -->
        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <!-- No content -->
        <link rel="stylesheet" href="/shared/styles/no-content.css">
        <!-- Button + -->
        <link rel="stylesheet" href="/shared/styles/btn-add.css">
        <!-- Modal de Confirmação -->
        <link rel="stylesheet" href="/shared/styles/modalConfirmation.css">

    </head>
    <body>
        <!-- Modal de Confirmação -->
        <section id="confirmation-modal" class="modalConfirm" style="display: none;"></section>

        <!-- Alertas -->
        <section id="alertFromShared" class="alert"></section>

        <!-- Botão de adição -->
        <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-medicamentos)"></section>
        
        <div class="app-page-wrapper">
            <div class="app-container">
                <!-- 1. NAVEGAÇÃO ENTRE MÓDULOS -->
                <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
                
                <!-- 2. CABEÇALHO DO MÓDULO (RETORNO + TÍTULO + TEMA) -->
                <header class="section-header-section" id="headerSection"></header>
                
                <!-- 3. SEÇÃO DE CONTEÚDO VAZIO -->
                <section class="no-content-section" id="no-content-section" hidden></section>

                <!-- CONTEÚDO PRINCIPAL DA HOME DE MEDICAMENTOS -->
                <main class="meds-main" id="main-content">
                    <div class="meds-stack">
                        <!-- 3. SEÇÃO “SUA MEDICAÇÃO” — DOSE ATRASADA (PRIORIDADE VISUAL) -->
                        <section aria-labelledby="section-delayed-title">
                            <div class="section-header-row">
                                <h2 class="meds-section-title" id="section-delayed-title">Sua medicação</h2>
                                <span class="meds-header-badge" id="home-pending-count">0 doses pendentes</span>
                            </div>

                            <div id="home-dose-priority"></div>
                        </section>

                        <!-- 4. SEÇÃO “PRÓXIMAS DOSES” -->
                        <section aria-labelledby="section-upcoming-title">
                            <div class="section-header-row">
                                <h2 class="meds-section-title" id="section-upcoming-title">Próximas doses</h2>
                            </div>

                            <div id="home-upcoming"></div>
                        </section>

                        <!-- 5. SEÇÃO “ATALHOS PRINCIPAIS” -->
                        <section aria-label="Atalhos rápidos de Medicamentos">
                            <div class="meds-shortcuts-grid">
                                <!-- Atalho 1: MEDICAÇÕES -->
                                <a href="/modules/medicamentos/components/medicacoes.html" class="card card--interactive meds-shortcut-card" id="shortcut-medicacoes" aria-label="Acessar listagem de Medicações (6 ativas)">
                                    <div class="shortcut-icon-wrap" aria-hidden="true">
                                        <i class="fa-solid fa-pills"></i>
                                    </div>
                                    <span class="shortcut-tag">MEDICAÇÕES</span>
                                    <span class="shortcut-value" id="home-active-medications">0 ativas</span>
                                </a>

                                <!-- Atalho 2: ROTINA -->
                                <div class="meds-shortcut-grid" tabindex="0">
                                    <a href="/modules/medicamentos/components/rotina.html" class="card card--interactive meds-shortcut-card" id="shortcut-rotina" aria-label="Acessar rotina de medicamentos (4 hoje)">
                                        <div class="shortcut-icon-wrap" aria-hidden="true">
                                            <i class="fa-regular fa-clock"></i>
                                        </div>
                                        <span class="shortcut-tag">ROTINA</span>
                                        <span class="shortcut-value" id="home-today-doses">0 hoje</span>
                                    </a>
                                </div>

                                <!-- Atalho 3: ESTOQUE -->
                                <div class="meds-shortcut-grid" tabindex="0">
                                    <a href="/modules/medicamentos/components/dashboard.html" class="card card--interactive meds-shortcut-card" id="shortcut-estoque" aria-label="Acessar dashboard de estoque (1 atenção)">
                                        <div class="shortcut-icon-wrap wrap-alert" aria-hidden="true">
                                            <i class="fa-solid fa-chart-simple"></i>
                                        </div>
                                        <span class="shortcut-tag">Dashboard</span>
                                        <span class="shortcut-value" id="home-stock-alert-count">0 alertas</span>
                                    </a>
                                </div>
                            </div>
                        </section>

                        <!-- 6. SEÇÃO “ATENÇÃO” (ESTOQUE BAIXO) -->
                        <section aria-labelledby="section-attention-title">
                            <div class="section-header-row">
                                <h2 class="meds-section-title" id="section-attention-title">Atenção</h2>
                            </div>

                            <div id="home-stock-list"></div>
                        </section>

                        <!-- 7. SEÇÃO “BONS HÁBITOS” -->
                        <section aria-labelledby="section-habits-title">
                            <div class="section-header-row">
                                <h2 class="meds-section-title" id="section-habits-title">Bons Hábitos</h2>
                                <a href="components/bons-habitos.html" class="btn-meds-secondary" id="btn-habits-progress">
                                    <span>Ver progresso</span>
                                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                                </a>
                            </div>

                            <div class="habits-scroll-wrapper" id="home-habits-list" role="region" aria-label="Lista de Bons Hábitos">
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        </div>

        <!-- Scripts do módulo e componentes compartilhados -->
        <script type="module" src="/modules/medicamentos/script.js"></script>
    </body>
</html>
