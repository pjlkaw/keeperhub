<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Despensa — KeeperHub
        </title>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/index.css">
        <script src="/shared/services/theme.js" defer></script>
        <script type="module" src="/modules/despensa/script.js"></script>
        <script type="module" src="/modules/despensa/js/index.js"></script>
        <script>
            window.keeperhubModuleConfig = {
                module: 'despensa',
                title: 'Despensa',
                subtitle: 'Sua despensa sob controle!',
                backUrl: '/main/hub/index.html',
                notificationsModule: 'despensa',
                addUrl: '/modules/despensa/components/cadastrar.html'
            };
        </script>
        <script src="/shared/services/load-components.js"></script>


    </head>
    <body class="despensa" data-pagina="index">
        <section id="alertFromShared" class="alert" role="status" aria-live="polite">
        </section>
        <div class="despensa-shell">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <header class="section-header-section" id="headerSection">
                <div class="section-header-title-area">
                    <div class="section-header-top-row">
            </header>
            <main class="despensa-conteudo" id="main-content">
                <section aria-labelledby="resumo-titulo">
                    <div class="despensa-resumo">
                        <a href="" class="card card--interactive summary-card">
                            <span class="summary-icon">
                                <i class="fa-regular fa-square-check" id="fa-icons"></i>
                            </span>
                            <span>
                                Produtos
                            </span>
                        <a href="components/vencimento.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                <i class="fa-regular fa-calendar" id="fa-icons"></i>
                            </span>
                            <span>
                                Próximos ao vencimento
                            </span>
                        </a>
                        <a href="components/checklist.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true" id="fa-icons">
                               <i class="fa-solid fa-list-ul"></i>
                            
                            </span>
                            <span>
                               Checklist
                            </span>
                            </strong>
                        </a>
                </section>

    <!-- PESQUISA -->

                <section id="produtos-cadastrados"aria-labelledby="produtos-titulo">
                    <h2 id="produtos-titulo">
                        Produtos 
                    </h2>
                 <main class="despensa-conteudo" id="main-content"> 
            <input
                type="search"
                id="searchInput"
                placeholder="Buscar produtos..."
                autocomplete="off">
        </section>

        <!-- CATEGORIAS -->

        <nav class="categories" 
        aria-label="Categorias de produtos">

            <button class="category active" data-category="Todos">
                Todos
            </button>

            <button class="category" data-category="Laticínios">
                Laticínios
            </button>

            <button class="category" data-category="Grãos">
                Grãos
            </button>

            <button class="category" data-category="Bebidas">
                Bebidas
            </button>

            <button class="category" data-category="Limpeza">
                Limpeza
            </button>

        </nav>

        <!-- LISTA DE PRODUTOS -->

        <section class="products-section">

            <section class="product-list" id="productList">

                <p class="empty-message">
                    Nenhum produto cadastrado.
                </p>

            </section>

        </section>

        <!-- BOTÃO ADICIONAR -->

        <button class="add-button" id="addButton" aria-label="Adicionar produto">
            <i class="fa-solid fa-plus"></i>
            
        </button>

    </main>

    <!-- MODAL DE CADASTRO -->

    <dialog id="productModal">

        <form id="productForm">

            <header class="modal-header">

                <h2 id="modalTitle">Adicionar produto</h2>

                <button type="button" id="closeModal" class="close-button">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </header>

            <section class="form-content">

                <label for="productName">Nome do produto</label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Ex: Leite integral"
                    required>

                <label for="productCategory">Categoria</label>

                <select id="productCategory" required>
                    <option value="">Selecione</option>
                    <option value="Laticínios">Laticínios</option>
                    <option value="Grãos">Grãos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Limpeza">Limpeza</option>
                    <option value="Outros">Outros</option>
                </select>

                <label for="productQuantity">Quantidade</label>

                <input
                    type="number"
                    id="productQuantity"
                    min="1"
                    value="1"
                    required>

                <label for="productExpiry">Data de validade</label>

                <input
                    type="date"
                    id="productExpiry">

            </section>

            <footer class="modal-footer">

                <button type="button" id="cancelButton" class="cancel-button">
                    Cancelar
                </button>

                <button type="submit" class="save-button">
                    Salvar produto
                </button>

            </footer>

        </form>

    </dialog>

    <script src="script.js"></script>

</body>
</html>
