<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Despensa — KeeperHub
        </title>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/index.css">
        <script src="/shared/services/theme.js" defer></script>
        <script type="module" src="/modules/despensa/script.js"></script>
        <script type="module" src="/modules/despensa/js/index.js"></script>
        <script>
      const configModule = window.keeperhubModuleConfig || {
    module: 'despensa',
    title: 'Despensa',
    subtitle: 'Gestão do seu mercado',
    backUrl: '/main/',
    notificationsModule: 'despensa',
    addUrl: '/modules/despensa/components/cadastrar.html'
};

function carregarModulo() {
    fetch('/shared/components/navbar-section.html')
        .then(response => response.text())
        .then(data => {
            const nav = document.getElementById('modules-nav-wrapper');
            if (!nav) return;

            nav.innerHTML = data;

            const moduloAtual = nav.querySelector(`[data-module="${configModule.module}"]`);
            if (!moduloAtual) return;

            moduloAtual.classList.add('active');
            moduloAtual.setAttribute('aria-selected', 'true');
            moduloAtual.setAttribute('tabindex', '0');
        });

    fetch('/shared/components/header-page.html')
        .then(response => response.text())
        .then(data => {
            const header = document.getElementById('headerSection');
            if (!header) return;

            header.innerHTML = data;

            const pageName = document.getElementById('pageNameH1');
            const pageSubtittle = document.getElementById('pageSubtittleSpan');
            const btnBackHeader = document.getElementById('btn-back-header');
            const btnNotifications = document.getElementById('btn-notifications');

            if (pageName) pageName.textContent = configModule.title;
            if (pageSubtittle) pageSubtittle.textContent = configModule.subtitle;
            if (btnBackHeader) btnBackHeader.href = configModule.backUrl;
            if (btnNotifications) {
                btnNotifications.href = `/shared/components/notifications.html?modulo=${configModule.notificationsModule}`;
            }
        });

    fetch('/shared/components/no-content.html')
        .then(response => response.text())
        .then(data => {
            const noContentSection = document.getElementById('no-content-section');
            if (!noContentSection) return;

            noContentSection.innerHTML = data;
        });

    if (configModule.addUrl) {
        fetch('/shared/components/btn-add.html')
            .then(response => response.text())
            .then(data => {
                const btnAddSection = document.getElementById('btn-add-section');
                if (!btnAddSection) return;

                btnAddSection.innerHTML = data;

                const btnAdd = btnAddSection.querySelector('#btn-add');
                if (btnAdd) btnAdd.href = configModule.addUrl;
            });
    }

    fetch('/shared/components/modal-confirmation.html')
        .then(response => response.text())
        .then(data => {
            const modal = document.getElementById('confirmation-modal');
            if (!modal) return;

            modal.innerHTML = data;
        });
}

carregarModulo();
    </script>


    </head>
    <body class="despensa" data-pagina="index">
        <section id="alertFromShared" class="alert" role="status" aria-live="polite">
        </section>
        <div class="despensa-shell">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <header class="section-header-section" id="headerSection">
                <div class="section-header-title-area">
                    <div class="section-header-top-row">
                       
                        <h1 id="pageNameH1" class="section-header-title">
                            Despensa
                        </h1>
                    </div>
                    <div class="section-header-meta">
                        <span id="pageSubtittleSpan">
                            Controle sua despensa
                        </span>
                    </div>
                </div>



            </header>
            <main class="despensa-conteudo" id="main-content">
                <section aria-labelledby="resumo-titulo">
                    <h2 id="resumo-titulo">
                        Resumo
                    </h2>
                    <div class="despensa-resumo">
                        <a href="components/produtos.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ▣
                            </span>
                            <span>
                                Produtos
                            </span>
                            <strong id="contador-produtos"></strong>
                        </a>
                        <a href="components/vencimento.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ◷
                            </span>
                            <span>
                                Próximos a vencer
                            </span>
                        </a>
                        <a href="components/checklist.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ≡
                            </span>
                            <span>
                               Checklist
                            </span>
                            
                             
                            </strong>
                        </a>
                        <a href="components/precos.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                $
                            </span>
                            <span>
                                Comparação de preços
                            </span>
                        </a>
                    </div>
                </section>
                <section id="produtos-cadastrados" aria-labelledby="produtos-titulo">
                    <h2 id="produtos-titulo">
                        Produtos cadastrados
                    </h2>
                    <div id="lista-produtos" class="lista-produtos" aria-live="polite">
                    </div>
                </section>
                <a class="floating-button" href="/modules/despensa/components/cadastrar.html" aria-label="Adicionar produto" title="Adicionar produto">
                    +
                </a>
            </main>
        </div>
    </body>
</html>
