<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Despensa — KeeperHub</title>

    <!-- Carrega os ícones utilizados na página -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Carrega os estilos compartilhados do projeto -->
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">

    <!-- Carrega os estilos específicos da despensa -->
    <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
    <link rel="stylesheet" href="/modules/despensa/assets/css/index.css">

    <!-- Define as informações e os caminhos do módulo -->
    <script>
        window.keeperhubModuleConfig = {
            module: 'despensa',
            title: 'Despensa',
            subtitle: 'Sua despensa sob controle!',
            backUrl: '/main/hub/index.html',
            notificationsModule: 'despensa',
            addUrl: '#novo-produto'
        };
    </script>

    <!-- Carrega os serviços compartilhados de tema e componentes -->
    <script src="/shared/services/theme.js" defer></script>
    <script src="/shared/services/load-components.js"></script>

    <!-- Carrega os scripts responsáveis pelo funcionamento da despensa -->
    <script type="module" src="/modules/despensa/script.js"></script>
    <script type="module" src="/modules/despensa/js/index.js"></script>

    <link rel="stylesheet" href="/shared/styles/modalConfirmation.css">
    <link rel="stylesheet" href="/shared/styles/btn-add.css">
    <link rel="stylesheet" href="/shared/styles/no-content.css">
</head>

<body class="despensa" data-pagina="index">

    <!-- Exibe mensagens de aviso e confirmação -->
    <section
        id="alertFromShared"
        class="alert"
        role="status"
        aria-live="polite">
    </section>

    <!-- Modal de confirmação compartilhado (substitui o confirm do navegador) -->
    <section id="confirmation-modal" class="modalConfirm" style="display: none;"></section>

    <!-- Botão de adicionar compartilhado -->
    <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-despensa)"></section>

    <div class="app-page-wrapper">

        <!-- Navegação entre módulos -->
        <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>

        <div class="app-container">


            <!-- Exibe o título e a descrição da página -->
            <header class="section-header-section" id="headerSection">

                <div class="section-header-title-area">

                    <div class="section-header-top-row">

                        <h1 id="pageNameH1" class="section-header-title">
                            Despensa
                        </h1>

                    </div>

                    <div class="section-header-meta">

                        <span id="pageSubtittleSpan">
                            Sua despensa sob controle!
                        </span>

                    </div>

                </div>

            </header>

            <!-- Tela "sem conteúdo" compartilhada (o JS mostra/esconde) -->
            <section class="no-content-section" id="no-content-section" aria-label="Nenhum produto cadastrado" hidden></section>

            <!-- Agrupa o conteúdo principal da despensa -->
            <main class="despensa-conteudo" id="main-content">

                <!-- Apresenta os atalhos e o resumo da despensa -->
                <section aria-labelledby="resumo-titulo">

                    <h2 id="resumo-titulo" class="visually-hidden">
                        Resumo da despensa
                    </h2>

                    <div class="despensa-resumo">

                        <!-- Direciona para a lista de produtos cadastrados -->
                        <a
                            href="#produtos-cadastrados"
                            class="card card--interactive summary-card">

                            <span class="summary-icon" aria-hidden="true">
                                <i class="fa-regular fa-square-check"></i>
                            </span>

                            <strong>Produtos</strong>

                            <span id="contador-produtos">0 itens</span>

                        </a>

                        <!-- Direciona para o controle de vencimentos -->
                        <a
                            href="components/vencimento.html"
                            class="card card--interactive summary-card">

                            <span class="summary-icon" aria-hidden="true">
                                <i class="fa-regular fa-calendar"></i>
                            </span>

                            <strong>Vencimentos</strong>

                            <span>Ver validades</span>

                        </a>

                        <!-- Direciona para a checklist de compras -->
                        <a
                            href="components/checklist.html"
                            class="card card--interactive summary-card">

                            <span class="summary-icon" aria-hidden="true">
                                <i class="fa-solid fa-list-ul"></i>
                            </span>

                            <strong>Checklist</strong>

                            <span>Ver lista</span>

                        </a>

                        <!-- Direciona para o estoque de medicamentos -->
                        <a
                            href="components/medicamentos.html"
                            class="card card--interactive summary-card">

                            <span class="summary-icon" aria-hidden="true">
                                <i class="fa-solid fa-pills"></i>
                            </span>

                            <strong>Medicamentos</strong>

                            <span>Ver estoque</span>

                        </a>

                    </div>

                </section>

                <!-- Exibe os produtos cadastrados -->
                <section
                    id="produtos-cadastrados"
                    aria-labelledby="produtos-titulo">

                    <h2 id="produtos-titulo">
                        Produtos
                    </h2>

                    <!-- Permite pesquisar produtos pelo nome -->
                    <section class="search-container">

                        <input
                            type="search"
                            id="searchInput"
                            class="input"
                            placeholder="Buscar produtos..."
                            autocomplete="off"
                            aria-label="Buscar produtos">

                    </section>

                    <!-- Filtra os produtos pela categoria selecionada -->
                    <nav
                        class="categories"
                        aria-label="Categorias de produtos">

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Todos">

                            Todos

                        </button>

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Laticínios">

                            Laticínios

                        </button>

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Grãos">

                            Grãos

                        </button>

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Bebidas">

                            Bebidas

                        </button>

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Limpeza">

                            Limpeza

                        </button>

                        <button
                            type="button"
                            class="card card--interactive"
                            data-category="Hortifruti">

                            Hortifruti

                        </button>

                    </nav>

                    <!-- Área onde os produtos cadastrados são exibidos -->
                    <section class="products-section">

                        <section
                            class="product-list"
                            id="productList"
                            aria-live="polite">

                            <p class="empty-message">
                                Nenhum produto cadastrado.
                            </p>

                        </section>

                    </section>

                </section>


            </main>

        </div>

    </div>

    <!-- Contém o formulário de cadastro de produtos -->
    <dialog id="productModal">

        <form id="productForm">

            <!-- Exibe o título e o botão para fechar o modal -->
            <header class="modal-header">

                <h2 id="modalTitle">
                    Adicionar produto
                </h2>

                <button
                    type="button"
                    id="closeModal"
                    class="close-button"
                    aria-label="Fechar">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </header>

            <!-- Reúne os campos para preencher os dados do produto -->
            <section class="form-content">

                <label for="productName">
                    Nome do produto
                </label>

                <input
                    type="text"
                    id="productName"
                    class="input"
                    placeholder="Ex: Leite integral"
                    required>

                <label for="productCategory">
                    Categoria
                </label>

                <select
                    id="productCategory"
                    class="input"
                    required>

                    <option value="">Selecione</option>
                    <option value="Laticínios">Laticínios</option>
                    <option value="Grãos">Grãos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Limpeza">Limpeza</option>
                    <option value="Hortifruti">Hortifruti</option>
                    <option value="Outros">Outros</option>

                </select>

                <label for="productQuantity">
                    Quantidade
                </label>

                <input
                    type="number"
                    id="productQuantity"
                    class="input"
                    min="1"
                    value="1"
                    required>

                <label for="productExpiry">
                    Data de validade
                </label>

                <input
                    type="date"
                    id="productExpiry"
                    class="input">

            </section>

            <!-- Disponibiliza as ações de cancelar e salvar -->
            <footer class="modal-footer">

                <button
                    type="button"
                    id="cancelButton"
                    class="btn cancel-button">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="btn btn-primary save-button">

                    Salvar produto

                </button>

            </footer>

        </form>

    </dialog>

</body>

</html>
