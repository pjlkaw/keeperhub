<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Despensa — KeeperHub
        </title>
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/index.css">
        <script src="/shared/services/theme.js" defer></script>
        <script type="module" src="/modules/despensa/script.js"></script>
        <script type="module" src="/modules/despensa/js/index.js"></script>
        <script>
        fetch('/shared/components/header-page.html').then(response => response.text()).then(data => {
            document.getElementById('headerSection').innerHTML = data;
            document.getElementById('pageNameH1').textContent ='Despensa' //Nome da Página
            document.getElementById('pageSubtittleSpan').textContent = 'Veja seu resumo:' // Subtítulo
            document.getElementById('btn-back-header').href = '/main/' // Botão voltar
            // Use '?modulo=nome-do-modulo' para abrir as notificações exclusivas.
            document.getElementById('btn-notifications').href = '/shared/components/notifications.html?modulo=nome-do-modulo'
        });
    </script>


    </head>
    <body class="despensa" data-pagina="index">
        <section id="alertFromShared" class="alert" role="status" aria-live="polite">
        </section>
        <div class="despensa-shell">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <header class="section-header-section" id="headerSection">
                <div class="section-header-title-area">
                    <div class="section-header-top-row">
                       
                        <h1 id="pageNameH1" class="section-header-title">
                            Despensa
                        </h1>
                    </div>
                    <div class="section-header-meta">
                        <span id="pageSubtittleSpan">
                            Controle sua despensa
                        </span>
                    </div>
                </div>



            </header>
            <main class="despensa-conteudo" id="main-content">
                <section aria-labelledby="resumo-titulo">
                    <h2 id="resumo-titulo">
                        Resumo
                    </h2>
                    <div class="despensa-resumo">
                        <a href="components/produtos.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ▣
                            </span>
                            <span>
                                Produtos
                            </span>
                        </a>
                        <a href="components/vencimento.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ◷
                            </span>
                            <span>
                                Próximos a vencer
                            </span>
                        </a>
                        <a href="#produtos-cadastrados" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                ≡
                            </span>
                            <span>
                                Quantidade
                            </span>
                            <strong id="contador-produtos">
                                Carregando…
                            </strong>
                        </a>
                        <a href="components/precos.html" class="card card--interactive summary-card">
                            <span class="summary-icon" aria-hidden="true">
                                $
                            </span>
                            <span>
                                Comparação de preços
                            </span>
                        </a>
                    </div>
                </section>
                <section id="produtos-cadastrados" aria-labelledby="produtos-titulo">
                    <h2 id="produtos-titulo">
                        Produtos cadastrados
                    </h2>
                    <div id="lista-produtos" class="lista-produtos" aria-live="polite">
                    </div>
                </section>
                <a class="floating-button" href="/modules/despensa/components/cadastrar.html" aria-label="Adicionar produto" title="Adicionar produto">
                    +
                </a>
            </main>
        </div>
    </body>
</html>
