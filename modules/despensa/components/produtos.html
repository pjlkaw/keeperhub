<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Todos os produtos — KeeperHub
        </title>
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
        <link rel="stylesheet" href="/shared/styles/variables.css">
        <link rel="stylesheet" href="/shared/styles/reset.css">
        <link rel="stylesheet" href="/shared/styles/components.css">
        <link rel="stylesheet" href="/shared/styles/header-page.css">
        <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
        <link rel="stylesheet" href="/modules/despensa/assets/css/produtos.css">
        <script src="/shared/services/theme.js" defer></script>
        <script type="module" src="/modules/despensa/script.js"></script>
        <script type="module" src="/modules/despensa/js/index.js"></script>
        <script>
            window.keeperhubModuleConfig = {
                module: 'despensa',
                title: 'Produtos',
                subtitle: '',
                backUrl: '/modules/despensa/index.html',
                notificationsModule: 'despensa'
            };
        </script>
        <script src="/shared/services/load-components.js"></script>

    </head>
    <body class="despensa" data-pagina="produtos">
        <section id="alertFromShared" class="alert" role="status" aria-live="polite">
        </section>
        <div class="despensa-shell">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos">
                <a href="/main/hub/index.html">   
                </a>
            </nav>
            <header class="section-header-section" id="headerSection">
                <div class="section-header-title-area">
                        </span>
                    </div>
                <div class="section-header-controls">
                </div>
            </header>
            <main class="despensa-conteudo" id="main-content">
                <!-- BUSCA -->
                <section class="search-container">

                    <input type="text" id="searchInput" aria-label="Buscar produtos" placeholder=" ⌕ Buscar produtos...">
                </section>
                <!-- FILTROS -->
                <nav class="filters" aria-label="Filtrar por categoria">
                    <button class="filter active" data-category="Todos">
                        Todos
                    </button>
                    <button class="filter" data-category="Laticínios">
                        Laticínios
                    </button>
                    <button class="filter" data-category="Grãos">
                        Grãos
                    </button>
                    <button class="filter" data-category="Bebidas">
                        Bebidas
                    </button>
                </nav>
                <p id="itemsBadge" role="status">
                </p>
                <!-- LISTA DE PRODUTOS -->
                <section class="products-list" id="productsList">    
                <!-- MENSAGEM DE NENHUM PRODUTO -->
                <section class="empty-message" id="emptyMessage">
                    <strong>
                        Nenhum produto encontrado
                    </strong>
                    <span>
                        Tente outra busca ou categoria.
                    </span>
                </section>
                <a class="floating-button" href="/modules/despensa/components/cadastrar.html" aria-label="Adicionar produto" title="Adicionar produto">
                    +
                </a>
            </main>
        </div>
    </body>
</html>
