
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vencimentos — KeeperHub</title>

    <!-- Carrega os ícones utilizados na página -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Carrega os estilos compartilhados do projeto -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="/shared/styles/btn-add.css">

    <!-- Carrega os estilos específicos da página de vencimentos -->
    <link rel="stylesheet" href="/modules/despensa/assets/css/layout.css">
    <link rel="stylesheet" href="/modules/despensa/assets/css/vencimento.css">

    <!-- Carrega o serviço responsável pelo tema -->
    <script src="/shared/services/theme.js" defer></script>

    <!-- Define as informações e os caminhos do módulo -->
    <script>
        window.keeperhubModuleConfig = {
            module: 'despensa',
            title: 'Vencimentos',
            subtitle: 'Controle de validade',
            backUrl: '../index.html',
            notificationsModule: 'Despensa',
            addUrl: '/modules/despensa/index.html'
        };
    </script>

    <!-- Carrega os componentes compartilhados do projeto -->
    <script src="/shared/services/load-components.js" defer></script>

    <!-- Carrega os produtos cadastrados e controla os vencimentos -->
    <script type="module"
        src="/modules/despensa/js/vencimentos.js">
    </script>

    <link rel="stylesheet" href="/shared/styles/no-content.css">
</head>

<body class="despensa" data-pagina="vencimento">

    <!-- Botão de adicionar compartilhado -->
    <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-despensa)"></section>

    <div class="despensa-shell">

        <!-- Exibe mensagens de aviso e confirmação -->
        <section
            id="alertFromShared"
            class="alert"
            role="status"
            aria-live="polite">
        </section>

        <!-- Reserva o espaço da navegação entre módulos -->
        <nav
            id="modules-nav-wrapper"
            class="modules-nav-wrapper"
            aria-label="Navegação entre módulos">
        </nav>

        <!-- Exibe o cabeçalho da página -->
        <header
            class="section-header-section"
            id="headerSection">
        </header>

        <!-- Tela "sem conteúdo" compartilhada (o JS mostra/esconde) -->
        <section class="no-content-section" id="no-content-section" aria-label="Nenhum produto com validade cadastrada" hidden></section>

        <!-- Agrupa o conteúdo principal da página -->
        <main class="despensa-conteudo" id="main-content">

            <!-- Apresenta o resumo dos produtos por vencimento -->
            <section
                class="resumo"
                aria-label="Resumo de vencimentos">

                <!-- Exibe a quantidade de produtos vencidos -->
                <div class="card resumo-card vencido">

                    <div class="titulo">
                        VENCIDOS
                    </div>

                    <div
                        class="numero vermelho"
                        id="contadorVencidos">
                        0
                    </div>

                </div>

                <!-- Exibe a quantidade de produtos que vencem em até 7 dias -->
                <div class="card resumo-card sete">

                    <div class="titulo">
                        VENCEM EM 7 DIAS
                    </div>

                    <div
                        class="numero laranja"
                        id="contadorSeteDias">
                        0
                    </div>

                </div>

            </section>

            <!-- Permite filtrar os produtos pelo prazo de vencimento -->
            <nav
                class="filtros"
                aria-label="Filtrar vencimentos">

                <button
                    type="button"
                    class="filtro ativo"
                    data-filter="todos">
                    Todos
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filter="vencidos">
                    Vencidos
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filter="7">
                    Em 7 dias
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filter="30">
                    Em 30 dias
                </button>

            </nav>

            <!-- Exibe a lista de produtos e suas respectivas validades -->
            <section class="produtosSection">

                <!-- Mostra a quantidade total de produtos na lista -->
                <span
                    class="produtosSection-title"
                    id="totalVencimentos">
                    Produtos - 0 Itens
                </span>

                <!-- O JavaScript adiciona automaticamente os produtos cadastrados na outra página -->
                <div
                    id="listaVencimentos"
                    aria-live="polite">
                </div>

            </section>

        </main>

    </div>

</body>

</html>
