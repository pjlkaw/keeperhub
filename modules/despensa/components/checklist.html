
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checklist — KeeperHub</title>

    <!-- Carrega os ícones utilizados na página -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Carrega os estilos compartilhados do projeto -->
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">

    <!-- Carrega o estilo geral da despensa -->
    <link rel="stylesheet"
        href="/modules/despensa/assets/css/layout.css">

    <!-- Carrega os estilos específicos da checklist -->
    <link rel="stylesheet"
        href="/modules/despensa/assets/css/checklist.css">

    <!-- Define as informações e os caminhos do módulo -->
    <script>
        window.keeperhubModuleConfig = {
            module: 'despensa',
            title: 'Checklist',
            subtitle: 'Gerencie suas compras!',
            backUrl: '/modules/despensa/index.html',
            notificationsModule: 'despensa'
        };
    </script>

    <!-- Carrega os serviços compartilhados de tema e componentes -->
    <script src="/shared/services/theme.js" defer></script>
    <script src="/shared/services/load-components.js" defer></script>

    <!-- Carrega o script responsável pelo funcionamento da checklist -->
    <script type="module"
        src="/modules/despensa/js/checklist.js"></script>

</head>

<body class="despensa" data-pagina="checklist">

    <!-- Exibe mensagens de aviso e confirmação -->
    <section
        id="alertFromShared"
        class="alert"
        role="status"
        aria-live="polite">
    </section>

    <div class="despensa-shell">

        <!-- Reserva o espaço da navegação entre módulos -->
        <nav
            id="modules-nav-wrapper"
            class="modules-nav-wrapper"
            aria-label="Navegação entre módulos">
        </nav>

        <!-- Exibe o cabeçalho compartilhado da página -->
        <header
            class="section-header-section"
            id="headerSection">
        </header>

        <!-- Agrupa o conteúdo principal da checklist -->
        <main class="checklist-page">

            <section class="checklist-container">

                <!-- Apresenta o resumo dos itens da lista -->
                <section
                    class="card checklist-summary"
                    aria-label="Resumo da lista">

                    <!-- Exibe a quantidade de itens selecionados -->
                    <div class="summary-item">
                        <span>Selecionados</span>
                        <strong id="totalSelecionados">0</strong>
                    </div>

                    <!-- Exibe a quantidade de itens comprados -->
                    <div class="summary-item">
                        <span>Comprados</span>
                        <strong id="totalComprados">0</strong>
                    </div>

                    <!-- Exibe o percentual de conclusão da lista -->
                    <div class="summary-item">
                        <span>Progresso</span>
                        <strong id="progressoTexto">0%</strong>
                    </div>

                    <!-- Exibe visualmente o progresso das compras -->
                    <div class="progress-track">
                        <div id="progressoBarra"></div>
                    </div>

                </section>

                <!-- Agrupa os produtos da lista de compras -->
                <section class="card shopping-list">

                    <!-- Exibe o título da lista -->
                    <div class="list-heading">
                        <h2>Minha lista</h2>
                    </div>

                    <!-- Permite pesquisar produtos pelo nome -->
                    <div class="search-box">

                        <input
                            id="buscaProduto"
                            type="search"
                            placeholder="Buscar produto...">

                    </div>

                    <!-- Permite filtrar os produtos da checklist -->
                    <nav
                        class="filter-row"
                        aria-label="Filtrar produtos">

                        <button
                            type="button"
                            class="filter active"
                            data-filtro="todos"
                            aria-pressed="true">

                            Todos

                        </button>

                        <button
                            type="button"
                            class="filter"
                            data-filtro="pendentes"
                            aria-pressed="false">

                            Pendentes

                        </button>

                    </nav>

                    <!-- Exibe os produtos adicionados à lista -->
                    <section
                        id="listaCompras"
                        class="shopping-items"
                        aria-live="polite">
                    </section>

                    <!-- Informa quando não existem produtos na lista -->
                    <p id="mensagemVazia" class="empty-message">
                        Sua lista está vazia. Adicione seu primeiro produto!
                    </p>

                    <!-- Abre o modal para adicionar um novo item -->
                    <button
                        type="button"
                        id="abrirModal"
                        class="add-list-button">

                        <i class="fa-solid fa-plus"></i>
                        Adicionar item na lista

                    </button>

                </section>

                <!-- Permite remover todos os itens da checklist -->
                <button
                    id="limparLista"
                    class="clear-button"
                    type="button">

                    <i class="fa-regular fa-trash-can"></i>
                    Limpar lista inteira

                </button>

            </section>

        </main>

    </div>

    <!-- Contém o formulário para adicionar produtos à checklist -->
    <dialog id="modalProduto" class="product-modal">

        <form id="formProduto">

            <!-- Exibe o título e o botão para fechar o modal -->
            <header class="modal-header">

                <h2>Adicionar item</h2>

                <button
                    type="button"
                    id="fecharModal"
                    class="close-button"
                    aria-label="Fechar">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </header>

            <!-- Reúne os campos para cadastrar um item -->
            <section class="modal-content">

                <label for="nomeProduto">
                    Nome do produto
                </label>

                <input
                    type="text"
                    id="nomeProduto"
                    placeholder="Ex: Arroz"
                    maxlength="80"
                    required>

                <!-- Agrupa os campos de quantidade e categoria -->
                <div class="form-row">

                    <div>

                        <label for="quantidadeProduto">
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidadeProduto"
                            min="1"
                            max="999"
                            value="1"
                            required>

                    </div>

                    <div>

                        <label for="categoriaProduto">
                            Categoria
                        </label>

                        <select id="categoriaProduto" required>

                            <option value="">Selecione</option>
                            <option value="Grãos">Grãos</option>
                            <option value="Laticínios">Laticínios</option>
                            <option value="Bebidas">Bebidas</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Hortifruti">Hortifruti</option>
                            <option value="Outros">Outros</option>

                        </select>

                    </div>

                </div>

            </section>

            <!-- Disponibiliza as ações de cancelar e adicionar -->
            <footer class="modal-footer">

                <button
                    type="button"
                    id="cancelarModal"
                    class="cancel-button">

                    Cancelar

                </button>

                <button
                    type="submit"
                    class="save-button">

                    <i class="fa-solid fa-plus"></i>
                    Adicionar

                </button>

            </footer>

        </form>

    </dialog>

</body>

</html>
