<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Receita</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <!-- Estilos da página (mesmo formulário do cadastro de consulta) -->
    <link rel="stylesheet" href="../assets/css/cadastrar-consulta.css">

    <!-- Configuração do módulo: título e retorno mudam na edição e com o pet da URL. -->
    <script>
      (function () {
        const parametros = new URLSearchParams(location.search);
        const edicao = parametros.has('id');
        const petId = parametros.get('petId');
        window.keeperhubModuleConfig = {
          module: 'pets',
          title: edicao ? 'Editar receita' : 'Adicionar receita',
          subtitle: edicao ? 'Atualize os dados e os anexos da receita' : 'Guarde as receitas do seu pet',
          backUrl: '/modules/pets/components/receitas.html' + (petId ? '?petId=' + encodeURIComponent(petId) : ''),
          notificationsModule: 'pets'
        };
      })();
    </script>
    <script src="/shared/services/load-components.js"></script>
    <link rel="stylesheet" href="../assets/css/essentials/responsive.css">
</head>
<body>
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <div class="app-container">

    <main class="adicionar-consulta">

        <!-- Cabeçalho da página -->
        <header class="section-header-section" id="headerSection"></header>

        <!-- Cadastro da receita (mesmo visual do cadastro de exame) -->
        <form class="formulario-adicionar-consulta formulario-exame formulario-receita" novalidate>

            <div class="campo-formulario">
                <label for="pet-receita">Pet</label>
                <select id="pet-receita" name="pet" required>
                    <option value="" selected disabled hidden>Selecione um pet</option>
                </select>
            </div>

            <div class="campo-formulario">
                <label for="nome-receita">Receita ou medicamento</label>
                <input type="text" id="nome-receita" name="nome" maxlength="150" placeholder="Ex: Bravecto antipulgas" required>
            </div>

            <div class="campo-formulario">
                <label for="veterinario-receita">Veterinário (opcional)</label>
                <input type="text" id="veterinario-receita" name="veterinario" maxlength="150" placeholder="Ex: Dra. Amanda Silva">
            </div>

            <div class="linha-formulario">
                <div class="campo-formulario">
                    <label for="emissao-receita">Emissão (opcional)</label>
                    <input type="date" id="emissao-receita" name="data_emissao">
                </div>
                <div class="campo-formulario">
                    <label for="validade-receita">Validade (opcional)</label>
                    <input type="date" id="validade-receita" name="data_validade">
                </div>
            </div>

            <div class="campo-formulario">
                <label for="observacao-receita">Observação (opcional)</label>
                <textarea id="observacao-receita" name="observacao" maxlength="2000" placeholder="Ex: 1 comprimido a cada 3 meses"></textarea>
            </div>

            <div class="campo-formulario">
                <label for="anexos-receita">Arquivo da receita (opcional)</label>
                <div class="seletor-anexos">
                    <input class="seletor-anexos__input" type="file" id="anexos-receita" name="anexos" multiple accept="application/pdf,image/jpeg,image/png,image/webp" aria-describedby="ajuda-anexos-receita resumo-anexos-receita">
                    <label class="seletor-anexos__botao" for="anexos-receita"><i class="fa-solid fa-paperclip" aria-hidden="true"></i> Escolher arquivos</label>
                    <span class="seletor-anexos__resumo" id="resumo-anexos-receita" data-anexos-selecionados aria-live="polite">Nenhum arquivo selecionado</span>
                </div>
                <p id="ajuda-anexos-receita" class="ajuda-anexos-exame">PDF, JPG, PNG ou WEBP. Até 10 arquivos e 1 MB no total.</p>
                <ul class="anexos-exame" data-anexos-salvos hidden></ul>
            </div>

            <button type="submit" class="botao-principal formulario-adicionar-consulta__enviar" aria-describedby="aviso-receita" disabled>
                Salvar receita
            </button>

            <p id="aviso-receita" class="aviso-integracao" role="status" aria-live="polite" data-estado="informativo">A receita será salva na sua conta.</p>
        </form>

    </main>

            </div>
        </div>

    <!-- Scripts -->
    <script type="module" src="../js/cadastrar-receita.js"></script>
    <script src="/shared/services/theme.js"></script>
    </body>
</html>
