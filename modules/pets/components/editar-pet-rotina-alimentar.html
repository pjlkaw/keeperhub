<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeeperHub — Editar Pet — Rotina Alimentar</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <!-- Estilos da página -->
    <link rel="stylesheet" href="../assets/css/editar-pet-rotina-alimentar.css">
    <link rel="stylesheet" href="../assets/css/essentials/responsive.css">

    <!-- Configuração do módulo -->
    <script>
      window.keeperhubModuleConfig = {
        module: 'pets',
        title: 'Editar Pet',
        subtitle: 'Organize a alimentação do seu pet',
        backUrl: '/modules/pets/index.html',
        notificationsModule: 'pets'
      };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <div class="app-container">
    <main class="editar-pet editar-pet--rotina-alimentar" data-pet-id="">
        <!-- Navegação entre módulos -->
        

        <!-- Cabeçalho da página -->
        <header class="section-header-section" id="headerSection"></header>

        <!-- Abas de edição -->
        <nav class="abas-pet" aria-label="Seções do pet">
            <a href="editar-pet-informacoes.html" class="abas-pet__link" data-manter-pet>Informações</a>
            <a href="editar-pet-rotina-alimentar.html" class="abas-pet__link abas-pet__link--ativo" aria-current="page" data-manter-pet>Rotina Alimentar</a>
            <a href="editar-pet-tutor.html" class="abas-pet__link" data-manter-pet>Tutor</a>
        </nav>

        <!-- Rotina alimentar -->
        <form class="formulario-rotina-alimentar" id="formulario-rotina-alimentar" data-pet-id="" novalidate>
            <!-- Refeições -->
            <section class="lista-refeicoes" aria-labelledby="titulo-refeicoes">
                <header class="lista-refeicoes__cabecalho">
                    <h2 id="titulo-refeicoes">Refeições</h2>
                    <button type="button" class="botao-texto lista-refeicoes__adicionar" id="adicionar-refeicao" aria-expanded="false" aria-controls="nova-refeicao">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        Adicionar Refeição
                    </button>
                </header>
                <div id="nova-refeicao" hidden></div>
                <ul class="lista-refeicoes__itens" id="lista-refeicoes">
                </ul>
                <p class="refeicoes-vazias" id="refeicoes-vazias" hidden>Nenhuma refeição cadastrada. Adicione a primeira refeição do pet.</p>
            </section>

            <!-- Alterações e desfazer exclusão -->
            <div class="aviso-rotina" id="aviso-rotina" hidden>
                <p id="status-rotina" role="status" aria-live="polite" aria-atomic="true"></p>
            </div>
            <div class="aviso-rotina aviso-rotina--desfazer" id="aviso-desfazer-rotina" hidden>
                <button type="button" class="botao-texto" id="desfazer-exclusao" hidden>Desfazer exclusão</button>
            </div>

            <!-- Observações da rotina -->
            <div class="observacoes-rotina">
                <label for="observacoes-rotina">Observações sobre a rotina</label>
                <textarea id="observacoes-rotina" name="observacoes-rotina" rows="4" maxlength="2000" placeholder="Adicione detalhes importantes sobre a rotina do pet..."></textarea>
            </div>

            <footer class="acoes-rotina-alimentar">
                <button type="submit" class="botao-principal acoes-rotina-alimentar__salvar">Salvar Alterações</button>
            </footer>
        </form>

    </main>

    <!-- Modelo da refeição -->
    <template id="modelo-cartao-refeicao">
        <li>
            <article class="card cartao-refeicao">
                <i class="fa-regular fa-clock icone-rotina cartao-refeicao__relogio" aria-hidden="true"></i>
                <div class="cartao-refeicao__informacoes">
                    <h3 class="cartao-refeicao__titulo"></h3>
                    <time class="cartao-refeicao__horario"></time>
                </div>
                <div class="cartao-refeicao__acoes">
                    <button type="button" class="botao-icone cartao-refeicao__editar">
                        <i class="fa-solid fa-pen-to-square icone-rotina" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="botao-icone cartao-refeicao__remover">
                        <i class="fa-solid fa-trash-can icone-rotina" aria-hidden="true"></i>
                    </button>
                </div>
            </article>
        </li>
    </template>

    <!-- Modelo do editor de refeição -->
    <template id="modelo-editor-refeicao">
        <fieldset class="editor-refeicao">
            <legend class="editor-refeicao__titulo"></legend>
            <div class="editor-refeicao__campos">
                <fieldset class="campo-formulario editor-refeicao__opcoes-campo">
                    <legend>Nome da refeição</legend>
                    <div class="opcoes-refeicao" role="radiogroup" aria-label="Escolha o tipo de refeição">
                        <label class="opcao-refeicao"><input type="radio" name="tipo_refeicao" value="cafe-da-manha" required><span>Café da manhã</span></label>
                        <label class="opcao-refeicao"><input type="radio" name="tipo_refeicao" value="almoco"><span>Almoço</span></label>
                        <label class="opcao-refeicao"><input type="radio" name="tipo_refeicao" value="cafe-da-tarde"><span>Café da tarde</span></label>
                        <label class="opcao-refeicao"><input type="radio" name="tipo_refeicao" value="jantar"><span>Jantar</span></label>
                        <label class="opcao-refeicao"><input type="radio" name="tipo_refeicao" value="outro"><span>Outro</span></label>
                    </div>
                    <!-- Exibido ao escolher Outro. -->
                    <div class="campo-formulario editor-refeicao__nome-personalizado" hidden>
                        <label for="nome-refeicao">Qual refeição?</label>
                        <input type="text" id="nome-refeicao" name="nome_refeicao" maxlength="60" placeholder="Digite o nome da refeição" autocomplete="off">
                    </div>
                </fieldset>
                <div class="campo-formulario">
                    <label for="horario-refeicao">Horário</label>
                    <input type="time" id="horario-refeicao" name="horario_refeicao" step="60" required>
                </div>
            </div>
            <div class="editor-refeicao__acoes">
                <button type="button" class="botao-principal" data-acao="confirmar">Confirmar</button>
                <button type="button" class="botao-secundario" data-acao="cancelar">Cancelar</button>
            </div>
        </fieldset>
    </template>

    <!-- Scripts -->
    <script type="module" src="../js/editarPetRotinaAlimentar.js"></script>
    <script src="/shared/services/theme.js"></script>
    </body>
</html>
