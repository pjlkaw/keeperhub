<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Receitas</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="/shared/styles/btn-add.css">
    <link rel="stylesheet" href="/shared/styles/no-content.css">
    <!-- Estilos da página -->
    <link rel="stylesheet" href="../assets/css/receitas.css">
    <link rel="stylesheet" href="../assets/css/essentials/responsive.css">

    <!-- Configuração do módulo -->
    <script>
      window.keeperhubModuleConfig = {
        module: 'pets',
        title: 'Receitas - Pets',
        subtitle: 'Consulte as receitas do seu pet',
        backUrl: '/modules/pets/index.html',
        notificationsModule: 'pets',
        addUrl: '/modules/pets/components/cadastrar-receita.html'
      };
    </script>
    <script defer src="/shared/services/load-components.js"></script>
</head>
<body>
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <div class="app-container">

    <main class="pagina-medicacoes pagina-receitas">

        <!-- Navegação entre módulos -->
        

        <!-- Cabeçalho da página -->
        <header class="section-header-section" id="headerSection"></header>

        <!-- Seletor de pet no mesmo lugar das páginas de Medicações e Vacinas -->
        <section class="seletor-pet-receitas" aria-label="Pet das receitas" hidden>
            <label for="pet-receitas">Pet</label>
            <select id="pet-receitas" name="pet_receitas"></select>
        </section>

        <nav class="abas-pet" aria-label="Tipo de registro">
            <a href="medicacoes.html" class="abas-pet__link">Medicações</a>
            <a href="receitas.html" class="abas-pet__link abas-pet__link--ativo" aria-current="page">Receitas</a>
            <a href="vacinacoes.html" class="abas-pet__link">Vacinas</a>
        </nav>

        <!-- Busca -->
        <div class="barra-ferramentas-medicacoes" hidden>
            <form class="busca-medicacoes" role="search">
                <label for="buscar-receita" class="somente-leitor-tela">Buscar receita</label>
                <i class="fa-solid fa-magnifying-glass icone" aria-hidden="true"></i>
                <input type="search" id="buscar-receita" name="buscar-receita" placeholder="Buscar receita...">
            </form>
        </div>
        <p id="status-receitas" class="status-receitas" role="status" aria-live="polite" hidden></p>

        <!-- Receitas ativas (validade em dia ou sem validade) -->
        <section class="receitas-lista" aria-labelledby="receitas-ativas-heading" hidden>
            <header class="receitas-lista__cabecalho">
                <h2 id="receitas-ativas-heading" class="receitas-lista__titulo receitas-lista__titulo--ativas">Receitas Ativas</h2>
                <span class="receitas-lista__contagem" data-contagem="ativas"></span>
            </header>
            <ul data-lista="ativas"></ul>
        </section>

        <!-- Histórico: receitas expiradas ou concluídas -->
        <section class="receitas-lista receitas-lista--historico" aria-labelledby="historico-receitas-heading" hidden>
            <header class="receitas-lista__cabecalho">
                <h2 id="historico-receitas-heading" class="receitas-lista__titulo">Histórico</h2>
                <span class="receitas-lista__contagem" data-contagem="historico"></span>
            </header>
            <ul data-lista="historico"></ul>
        </section>

        <section class="no-content-section" id="no-content-section" aria-label="Nenhuma receita cadastrada"></section>

    </main>

    <section class="btn-add-section" id="btn-add-section" style="--btn-add-color: var(--tool-pets)" aria-label="Adicionar receita"></section>

    <!-- Scripts -->
    <script type="module" src="../js/receitas.js"></script>
    <script src="/shared/services/theme.js"></script>
    </body>
</html>
