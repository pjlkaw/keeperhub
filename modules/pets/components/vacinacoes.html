<!doctype html>
<html lang="pt-BR" data-theme="dark" class="tema-vacinacoes-pets">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0b0b0d" />
		<title>Keeper Hub — Pets — Vacinações</title>
		<link rel="icon" type="image/png" href="/shared/img/logo-pets.png" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>

		<!-- Estilos compartilhados -->
		<link rel="stylesheet" href="/shared/styles/variables.css" />
		<link rel="stylesheet" href="/shared/styles/reset.css" />
		<link rel="stylesheet" href="/shared/styles/no-content.css" />
		<link rel="stylesheet" href="/shared/styles/components.css" />
		<link rel="stylesheet" href="/shared/styles/header-page.css" />
		<link rel="stylesheet" href="/shared/styles/navbar-modules.css" />
		<link rel="stylesheet" href="/shared/styles/btn-add.css" />
		<!-- Estilos da página -->
		<link rel="stylesheet" href="../assets/css/vacinacoes.css" />
    <link rel="stylesheet" href="../assets/css/essentials/responsive.css">
		<!-- Configuração do módulo -->
		<script>
			window.keeperhubModuleConfig = {
				module: "pets",
				title: "Vacinações",
				subtitle: "Acompanhe as vacinas do seu pet",
				backUrl: "/modules/pets/index.html",
				notificationsModule: "pets",
				addUrl: "/modules/pets/components/cadastrar-registro.html?tipo=vacina",
			};
		</script>
		<script defer src="/shared/services/load-components.js"></script>
	</head>
	<body>
		<div class="app-page-wrapper">
			<nav
				id="modules-nav-wrapper"
				class="modules-nav-wrapper"
				aria-label="Navegação entre módulos"
			></nav>
			<div class="app-container">
				<!-- Estado vazio -->
				<section
					class="no-content-section"
					id="no-content-section"
					aria-label="Nenhuma vacina cadastrada"
				></section>

				<main
					class="vacinacoes-pet"
					id="conteudo-principal"
					data-pet-id=""
				>
					<!-- Navegação entre módulos -->

					<!-- Cabeçalho da página -->
					<header
						class="section-header-section"
						id="headerSection"
					></header>

					<!-- Navegação entre medicações e vacinas -->
					<nav class="abas-pet" aria-label="Tipo de registro">
						<a href="medicacoes.html" class="abas-pet__link">Medicações</a>
						<a href="vacinacoes.html" class="abas-pet__link abas-pet__link--ativo" aria-current="page">Vacinas</a>
					</nav>

					<!-- Próximas vacinas -->
					<section
						class="destaques-vacinas"
						aria-labelledby="proximas-vacinas-heading"
						hidden
					>
						<h2 id="proximas-vacinas-heading">Próximas Vacinas</h2>

						<ul>
							<li>
								<article
									class="card cartao-destaque-vacina cartao-destaque-vacina--destaque"
								>
									<p
										class="cartao-destaque-vacina__rotulo"
									></p>
									<h3
										class="cartao-destaque-vacina__nome"
									></h3>
									<i
										class="fa-solid fa-paw icone"
										aria-hidden="true"
									></i>

									<p class="cartao-destaque-vacina__data">
										<i
											class="fa-regular fa-calendar-days icone"
											aria-hidden="true"
										></i>
									</p>

									<p
										class="cartao-destaque-vacina__contagem-regressiva"
									></p>
								</article>
							</li>

							<li>
								<article class="card cartao-destaque-vacina">
									<p
										class="cartao-destaque-vacina__rotulo"
									></p>
									<h3
										class="cartao-destaque-vacina__nome"
									></h3>
									<i
										class="fa-solid fa-syringe icone"
										aria-hidden="true"
									></i>

									<p class="cartao-destaque-vacina__data">
										<i
											class="fa-regular fa-calendar-days icone"
											aria-hidden="true"
										></i>
									</p>

									<p
										class="cartao-destaque-vacina__contagem-regressiva"
									></p>
								</article>
							</li>
						</ul>
					</section>

					<!-- Histórico de aplicações -->
					<section
						class="historico-vacinas"
						aria-labelledby="vaccine-history-heading"
						hidden
					>
						<h2 id="vaccine-history-heading">Histórico</h2>

						<ul class="card linha-tempo-medica lista-historico-pets">
							<li class="item-historico-pets">
								<article
									class="linha-tempo-medica__item cartao-historico-pets cartao-historico-pets--vacina"
								>
									<i
										class="fa-solid fa-syringe icone"
										aria-hidden="true"
									></i>
									<div class="linha-tempo-medica__conteudo">
										<h3 class="linha-tempo-medica__titulo"></h3>
										<p class="linha-tempo-medica__data"></p>
										<p class="linha-tempo-medica__descricao"></p>
									</div>
								</article>
							</li>

							<li class="item-historico-pets">
								<article
									class="linha-tempo-medica__item cartao-historico-pets cartao-historico-pets--vacina"
								>
									<i
										class="fa-solid fa-syringe icone"
										aria-hidden="true"
									></i>
									<div class="linha-tempo-medica__conteudo">
										<h3 class="linha-tempo-medica__titulo"></h3>
										<p class="linha-tempo-medica__data"></p>
										<p class="linha-tempo-medica__descricao"></p>
									</div>
								</article>
							</li>
						</ul>
					</section>
				</main>

				<section
					class="btn-add-section"
					id="btn-add-section"
					style="--btn-add-color: var(--tool-pets)"
					aria-label="Adicionar vacina"
				></section>

				<!-- Scripts -->
				<script type="module" src="../js/vacinacoes.js"></script>
				<script src="/shared/services/theme.js"></script>
	</body>
</html>
