<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Rotina Diária</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos Estruturais e Compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/no-content.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/rotina-diaria.css">
  <link rel="stylesheet" href="../assets/css/botao-adicionar-pets.css">

    <script>
      window.keeperhubModuleConfig = {
        module: 'pets',
        title: 'Rotina Diária',
        subtitle: 'Acompanhe os cuidados diários do seu pet',
        backUrl: '/modules/pets/index.html',
        notificationsModule: 'pets'
      };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>

    <section class="no-content-section" id="no-content-section" aria-label="Nenhuma rotina cadastrada"></section>

    <main class="rotina-diaria">

        <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>

        <header class="section-header-section" id="headerSection"></header>

        <section class="seletor-pet-rotina" hidden>
            <label for="pet-rotina">Pet</label>
            <select id="pet-rotina" aria-describedby="status-rotina-diaria">
                <option value="">Selecione um pet</option>
            </select>
            <p id="status-rotina-diaria" role="status" hidden></p>
        </section>

        <section class="card rotina-diaria__hoje" aria-labelledby="hoje-heading" hidden>
            <h2 id="hoje-heading">Hoje</h2>

            <ul class="linha-tempo-rotina" id="linha-tempo-rotina">
            </ul>
            <p class="rotina-diaria__vazia" data-vazio="atividades" hidden>Nenhuma atividade diária cadastrada.</p>

            <a href="cadastrar-rotina.html" data-manter-pet class="link-editar">Editar</a>
        </section>

        <section class="card higiene-bem-estar" aria-labelledby="higiene-heading" hidden>
            <h2 id="higiene-heading">Higiene e Bem-estar</h2>

            <ul></ul>
            <p class="rotina-diaria__vazia" data-vazio="higiene" hidden>Nenhum cuidado de higiene cadastrado.</p>

            <a href="cadastrar-rotina.html#higiene-heading" data-manter-pet class="link-editar">Editar</a>
        </section>

        <section class="card rotina-alimentar" aria-labelledby="rotina-alimentar-heading" hidden>
            <header class="rotina-alimentar__cabecalho">
                <h2 id="rotina-alimentar-heading">Rotina Alimentar</h2>
                <a href="editar-pet-rotina-alimentar.html?origem=rotina-diaria" class="link-editar" data-manter-pet>Editar refeições</a>
            </header>
            <ul class="rotina-alimentar__lista" id="resumo-refeicoes">
            </ul>
            <p class="rotina-alimentar__mensagem" id="resumo-refeicoes-vazio" hidden>Nenhuma refeição cadastrada.</p>
            <p class="rotina-alimentar__mensagem" id="resumo-refeicoes-mensagem" role="status" hidden></p>
            <p class="rotina-alimentar__observacoes" id="resumo-refeicoes-observacoes" hidden></p>
        </section>

        <section class="card anotacoes-comportamento" aria-labelledby="notas-heading" hidden>
            <h2 id="notas-heading">Notas de Comportamento</h2>

            <form class="anotacoes-comportamento__formulario">
                <label for="nova-observacao" class="somente-leitor-tela">Adicionar nova observação</label>
                <textarea id="nova-observacao" name="nova_observacao" placeholder="Adicionar nova observação..."></textarea>
                <button type="submit" class="botao-icone anotacoes-comportamento__enviar" aria-label="Enviar observação">
                    <i class="fa-solid fa-paper-plane icone" aria-hidden="true"></i>
                </button>
            </form>

            <ul class="anotacoes-comportamento__lista"></ul>
            <p class="rotina-diaria__vazia" data-vazio="anotacoes" hidden>Nenhuma anotação cadastrada.</p>

            <!-- Destino incerto: ver dúvida sobre o que "Editar" faz nessa seção específica -->
            <a href="#" class="link-editar">Editar</a>
        </section>

        <a href="cadastrar-rotina.html" data-manter-pet class="botao-flutuante" aria-label="Adicionar rotina">
            <span class="icone" aria-hidden="true"></span>
        </a>

    </main>

    <template id="modelo-refeicao-resumo">
        <li>
            <article class="card cartao-refeicao">
                <h3 class="cartao-refeicao__titulo"></h3>
                <time class="cartao-refeicao__horario"></time>
            </article>
        </li>
    </template>

    <script type="module" src="../js/rotina-diaria.js"></script>
    <script src="/shared/services/theme.js"></script>
</body>
</html>
