<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Editar Pet (Tutor)</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos Estruturais e Compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <link rel="stylesheet" href="../assets/css/editar-pet-tutor.css">

    <script>
      window.keeperhubModuleConfig = {
        module: 'pets',
        title: 'Editar Pet',
        subtitle: 'Atualize os contatos e os dados do tutor',
        backUrl: '/modules/pets/index.html',
        notificationsModule: 'pets'
      };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>

    <main class="editar-pet editar-pet--tutor">

        <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>

        <header class="section-header-section" id="headerSection"></header>

        <nav class="abas-pet" aria-label="Seções do pet">
            <a href="editar-pet-informacoes.html" class="abas-pet__link">Informações</a>
            <a href="editar-pet-rotina-alimentar.html" class="abas-pet__link">Rotina Alimentar</a>
            <a href="editar-pet-tutor.html" class="abas-pet__link abas-pet__link--ativo" aria-current="page">Tutor</a>
        </nav>

        <form class="formulario-editar-pet">

            <section class="aviso-informativo">
                <i class="fa-solid fa-triangle-exclamation icone" aria-hidden="true"></i>
                <div class="aviso-informativo__conteudo">
                    <h2 class="aviso-informativo__titulo">Dados de Emergência</h2>
                    <p class="aviso-informativo__descricao">
                        Estas informações são essenciais para garantir um contato rápido e seguro em casos de necessidade ou emergência durante os cuidados com o pet.
                    </p>
                </div>
            </section>

            <div class="campo-formulario">
                <label for="nome-tutor">Nome do Tutor</label>
                <input type="text" id="nome-tutor" name="nome-tutor" value="Maria Silva">
            </div>

            <div class="campo-formulario">
                <label for="telefone-emergencia">Telefone de Emergência</label>
                <input type="tel" id="telefone-emergencia" name="telefone-emergencia" value="(11) 98765-4321">
            </div>

            <button type="submit" class="botao-principal formulario-editar-pet__enviar">
                Salvar Alterações
            </button>

        </form>

    </main>

    <script src="/shared/services/theme.js"></script>
<!-- Integração futura: ../js/editar-pet-tutor.js (arquivo ainda não implementado). -->
</body>
</html>
