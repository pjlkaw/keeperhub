<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Editar Pet (Tutor)</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <main class="edit-pet">

        <header class="page-header">
            <a href="#" class="page-header__back">
                <span class="icon" aria-hidden="true"></span>
                <span class="sr-only">Voltar</span>
            </a>
            <h1 class="page-header__title">Editar Pet</h1>
        </header>

        <nav class="pet-tabs" aria-label="Seções do pet">
            <a href="#" class="pet-tabs__link">Informações</a>
            <a href="#" class="pet-tabs__link">Rotina</a>
            <a href="#" class="pet-tabs__link pet-tabs__link--active" aria-current="page">Tutor</a>
        </nav>

        <form class="edit-pet-form">

            <section class="info-notice">
                <span class="icon" aria-hidden="true"></span>
                <div class="info-notice__content">
                    <h2 class="info-notice__title">Dados de Emergência</h2>
                    <p class="info-notice__description">
                        Estas informações são essenciais para garantir um contato rápido e seguro em casos de necessidade ou emergência durante os cuidados com o pet.
                    </p>
                </div>
            </section>

            <div class="form-field">
                <label for="nome-tutor">Nome do Tutor</label>
                <input type="text" id="nome-tutor" name="nome-tutor" value="Maria Silva">
            </div>

            <div class="form-field">
                <label for="telefone-emergencia">Telefone de Emergência</label>
                <input type="tel" id="telefone-emergencia" name="telefone-emergencia" value="(11) 98765-4321">
            </div>

            <button type="submit" class="primary-button edit-pet-form__submit">
                Salvar Alterações
            </button>

        </form>

    </main>

    <script src="../js/script.js" defer></script>
</body>
</html>
