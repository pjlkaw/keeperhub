<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Editar Pet (Rotina)</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <main class="edit-pet">

        <header class="page-header">
            <a href="#" class="page-header__back">
                <span class="icon" aria-hidden="true"></span>
                <span class="sr-only">Voltar</span>
            </a>
            <h1 class="page-header__title">Editar Pet</h1>
        </header>

        <nav class="pet-tabs" aria-label="Seções do pet">
            <a href="#" class="pet-tabs__link">Informações</a>
            <a href="#" class="pet-tabs__link pet-tabs__link--active" aria-current="page">Rotina</a>
            <a href="#" class="pet-tabs__link">Tutor</a>
        </nav>

        <form class="edit-pet-form">

            <section class="meal-list">
                <header class="meal-list__header">
                    <h2>Refeições</h2>
                    <button type="button" class="text-button meal-list__add">
                        <span class="icon" aria-hidden="true"></span>
                        Adicionar Refeição
                    </button>
                </header>

                <ul>
                    <li>
                        <article class="meal-card">
                            <span class="icon" aria-hidden="true"></span>
                            <div class="meal-card__info">
                                <h3 class="meal-card__title">Café da manhã</h3>
                                <p class="meal-card__time">06:00</p>
                            </div>
                            <button type="button" class="icon-button" aria-label="Editar refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                            <button type="button" class="icon-button" aria-label="Remover refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                        </article>
                    </li>

                    <li>
                        <article class="meal-card">
                            <span class="icon" aria-hidden="true"></span>
                            <div class="meal-card__info">
                                <h3 class="meal-card__title">Almoço</h3>
                                <p class="meal-card__time">12:00</p>
                            </div>
                            <button type="button" class="icon-button" aria-label="Editar refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                            <button type="button" class="icon-button" aria-label="Remover refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                        </article>
                    </li>

                    <li>
                        <article class="meal-card">
                            <span class="icon" aria-hidden="true"></span>
                            <div class="meal-card__info">
                                <h3 class="meal-card__title">Jantar</h3>
                                <p class="meal-card__time">19:00</p>
                            </div>
                            <button type="button" class="icon-button" aria-label="Editar refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                            <button type="button" class="icon-button" aria-label="Remover refeição">
                                <span class="icon" aria-hidden="true"></span>
                            </button>
                        </article>
                    </li>
                </ul>
            </section>

            <div class="form-field">
                <label for="observacoes-rotina">Observações sobre a rotina</label>
                <textarea id="observacoes-rotina" name="observacoes-rotina" placeholder="Adicione detalhes importantes sobre a rotina do pet..."></textarea>
            </div>

            <button type="submit" class="primary-button edit-pet-form__submit">
                Salvar Alterações
            </button>

        </form>

    </main>

    <script src="../js/script.js" defer></script>
</body>
</html>
