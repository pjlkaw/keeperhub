<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper Hub — Pets — Adicionar Rotina</title>
    <link rel="icon" type="image/png" href="/shared/img/logo-pets.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Estilos compartilhados -->
    <link rel="stylesheet" href="/shared/styles/variables.css">
    <link rel="stylesheet" href="/shared/styles/reset.css">
    <link rel="stylesheet" href="/shared/styles/components.css">
    <link rel="stylesheet" href="/shared/styles/header-page.css">
    <link rel="stylesheet" href="/shared/styles/navbar-modules.css">
    <!-- Estilos da página -->
    <link rel="stylesheet" href="../assets/css/cadastrar-rotina.css">

    <!-- Configuração do módulo -->
    <script>
      window.keeperhubModuleConfig = {
        module: 'pets',
        title: 'Adicionar Rotina',
        subtitle: 'Organize os cuidados diários do seu pet',
        backUrl: '/modules/pets/components/rotina-diaria.html',
        notificationsModule: 'pets'
      };
    </script>
    <script src="/shared/services/load-components.js"></script>
</head>
<body>
        <div class="app-page-wrapper">
            <nav id="modules-nav-wrapper" class="modules-nav-wrapper" aria-label="Navegação entre módulos"></nav>
            <div class="app-container">

    <main class="adicionar-rotina">

        <!-- Navegação entre módulos -->
        

        <!-- Cabeçalho da página -->
        <header class="section-header-section" id="headerSection"></header>

        <!-- Acesso à rotina alimentar -->
        <section class="adicionar-rotina__alimentacao" aria-labelledby="alimentacao-heading">
            <h2 id="alimentacao-heading">Alimentação</h2>
            <p>Organize os nomes e horários das refeições na rotina alimentar do pet.</p>
            <div class="acesso-alimentacao">
                <a href="editar-pet-rotina-alimentar.html?origem=cadastrar-rotina&amp;acao=adicionar" class="botao-principal" data-manter-pet>Adicionar refeição</a>
                <a href="editar-pet-rotina-alimentar.html?origem=cadastrar-rotina" class="botao-texto" data-manter-pet>Ver e editar refeições</a>
            </div>
        </section>

        <!-- Higiene e bem-estar (sem gravação) -->
        <section class="adicionar-rotina__higiene" aria-labelledby="higiene-heading">
            <h2 id="higiene-heading">Higiene e Bem-estar</h2>

            <form class="formulario-higiene">

                <fieldset class="campo-formulario">
                    <legend>Atividade</legend>
                    <ul class="opcoes-atividade">
                        <li>
                            <label class="opcoes-atividade__opcao">
                                <input type="radio" name="atividade" value="banho">
                                Banho
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-atividade__opcao">
                                <input type="radio" name="atividade" value="banho_tosa">
                                Banho e Tosa
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-atividade__opcao">
                                <input type="radio" name="atividade" value="corte_unha">
                                Corte de Unha
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-atividade__opcao">
                                <input type="radio" name="atividade" value="escovacao">
                                Escovação
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-atividade__opcao">
                                <input type="radio" name="atividade" value="passeio_matinal">
                                Passeio Matinal
                            </label>
                        </li>
                    </ul>
                </fieldset>

                <fieldset class="campo-formulario">
                    <legend>Frequência</legend>
                    <ul class="opcoes-frequencia">
                        <li>
                            <label class="opcoes-frequencia__opcao">
                                <input type="radio" name="frequencia_higiene" value="semanal">
                                Semanal
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-frequencia__opcao">
                                <input type="radio" name="frequencia_higiene" value="quinzenal">
                                A cada 15 dias
                            </label>
                        </li>
                        <li>
                            <label class="opcoes-frequencia__opcao">
                                <input type="radio" name="frequencia_higiene" value="mensal">
                                Mensal
                            </label>
                        </li>
                    </ul>
                </fieldset>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="data-atividade">Data</label>
                        <input type="date" id="data-atividade" name="data_atividade">
                    </div>

                    <div class="campo-formulario">
                        <label for="horario-atividade">Horário</label>
                        <input type="time" id="horario-atividade" name="horario_atividade">
                    </div>
                </div>

                <button type="submit" class="botao-principal">
                    Adicionar Atividade
                </button>

            </form>
        </section>

    </main>

    <!-- Tema -->
    <script src="/shared/services/theme.js"></script>

            </div>
        </div>
    </body>
</html>
